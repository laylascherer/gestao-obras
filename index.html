      if (Math.max(v.width, v.height) > 1250) return arquivo;
      const texto = await pagina.getTextContent();
      if (texto.items.map(t => t.str).join('').trim().length > 80) comTexto++;
    }
    if (comTexto > pdf.numPages / 2) return arquivo;

    let doc;
    const canvas = document.createElement('canvas');
    for (let i = 1; i <= pdf.numPages; i++) {
      mostrarAvisoFixo(`Reduzindo o PDF… página ${i} de ${pdf.numPages}`);
      const pagina = await pdf.getPage(i);
      const base = pagina.getViewport({ scale: 1 });
      const vp = pagina.getViewport({ scale: Math.min(2.2, LADO_MAXIMO_FOTO / Math.max(base.width, base.height)) });
      canvas.width = Math.round(vp.width); canvas.height = Math.round(vp.height);
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      await pagina.render({ canvasContext: ctx, viewport: vp }).promise;
      const jpg = canvas.toDataURL('image/jpeg', 0.72);
      const formato = [base.width, base.height];
      const orientacao = base.width > base.height ? 'l' : 'p';
      if (!doc) doc = new jspdf.jsPDF({ orientation: orientacao, unit: 'pt', format: formato });
      else doc.addPage(formato, orientacao);
      doc.addImage(jpg, 'JPEG', 0, 0, base.width, base.height);
    }
    const blob = doc.output('blob');
    return blob.size < arquivo.size * 0.8 ? new File([blob], arquivo.name, { type: 'application/pdf' }) : arquivo;
  }

  const scriptsCarregados = {};
  function carregarScript(src) {
    if (!scriptsCarregados[src]) {
      scriptsCarregados[src] = new Promise((resolve, reject) => {
        const tag = document.createElement('script');
        tag.src = src;
        tag.onload = resolve;
        tag.onerror = () => { delete scriptsCarregados[src]; reject(new Error('Sem internet para carregar ' + src)); };
        document.head.appendChild(tag);
      });
    }
    return scriptsCarregados[src];
  }

  /* ---------- Abrir anexos ----------
   * Os arquivos ficam privados no Drive. O site busca o arquivo no servidor (quem entrou no
   * site pode ver) e abre numa nova aba, sem pedir conta Google nem autorização. */
  async function abrirAnexo(evento, url) {
    evento.preventDefault();
    const janela = window.open('', '_blank');
    if (janela) janela.document.write('<p style="font-family:sans-serif;padding:24px;color:#555">Abrindo o arquivo…</p>');
    try {
      const a = await chamar('baixarArquivo', url, auth());
      const binario = atob(a.base64);
      const bytes = new Uint8Array(binario.length);
      for (let i = 0; i < binario.length; i++) bytes[i] = binario.charCodeAt(i);
      const endereco = URL.createObjectURL(new Blob([bytes], { type: a.tipo }));
      const daParaVer = /^(application\/pdf|image\/|text\/plain)/.test(a.tipo);
      if (janela && daParaVer) {
        janela.location.href = endereco;
      } else {
        if (janela) janela.close();
        const link = document.createElement('a'); // outros tipos (DWG, XML…) são baixados
        link.href = endereco; link.download = a.nome;
        document.body.appendChild(link); link.click(); link.remove();
      }
      setTimeout(() => URL.revokeObjectURL(endereco), 120000);
    } catch (erro) {
      if (janela) janela.close();
      mostrarErro(erro);
    }
    return false;
  }

  // Lê o arquivo escolhido, converte para texto (base64) e envia para o Drive
  async function enviarArquivo(idDocumento, campo) {
    const arquivo = campo.files[0];
    if (!arquivo) return;
    if (arquivo.size > TAMANHO_ORIGINAL_MB * 1024 * 1024) {
      campo.value = '';
      return mostrarMensagem(`O arquivo passa de ${TAMANHO_ORIGINAL_MB} MB. Envie um arquivo menor.`, 'erro');
    }

    const linha = document.getElementById('doc-' + idDocumento);
    linha.querySelectorAll('button, input').forEach(el => el.disabled = true);
    linha.querySelector('.anexo').insertAdjacentHTML('afterbegin', '<span class="suave">Enviando…</span>');

    try {
      const resposta = await chamar('anexarDocumento', idDocumento, await lerArquivo(arquivo), auth());
      Object.assign(estado.obraAberta.documentos.find(d => d.ID_Documento === idDocumento), resposta);
      mostrarMensagem('Arquivo anexado!');
    } catch (erro) {
      mostrarErro(erro);
    }
    Object.assign(estado.obraAberta.comercial, lerFormulario('form-comercial'));
    desenharComercial();
  }

  async function removerArquivo(idDocumento) {
    if (!confirm('Remover o arquivo anexado? Ele vai para a lixeira do Google Drive.')) return;
    try {
      await chamar('removerAnexo', idDocumento, auth());
      Object.assign(estado.obraAberta.documentos.find(d => d.ID_Documento === idDocumento),
        { Arquivo: '', Recebido: false });
      mostrarMensagem('Anexo removido.');
    } catch (erro) {
      mostrarErro(erro);
    }
    Object.assign(estado.obraAberta.comercial, lerFormulario('form-comercial'));
    desenharComercial();
  }

  async function enviarContrato() {
    if (!confirm('Enviar esta ficha para o setor de Contrato? Depois disso ela fica só para consulta.')) return;
    const salvou = await salvarFichaComercial(true);
    if (!salvou) return;
    const botao = document.getElementById('btn-enviar');
    botao.disabled = true; botao.textContent = 'Enviando…';
    try {
      await chamar('enviarParaContrato', estado.obraAberta.obra.ID_Obra, auth());
      mostrarMensagem('Enviado para o Contrato!');
      telaObra(estado.obraAberta.obra.ID_Obra);
    } catch (erro) {
      mostrarErro(erro);
      botao.disabled = false; botao.textContent = 'Enviar para Contrato →';
    }
  }

  /* =========================================================
   * TELA 7 – Setor Contrato
   * Passos: Em elaboração → Aguardando assinatura → Assinado
   * ========================================================= */
  const PASSOS_CONTRATO = ['Em elaboração', 'Aguardando assinatura', 'Assinado'];


  async function telaContrato(idObra) {
    carregando('Abrindo Contrato…');
    try {
      estado.contrato = await chamar('abrirContrato', idObra, auth());
      desenharContrato();
    } catch (erro) { mostrarErro(erro); irPara('#/obra/' + idObra); }
  }

  function linkArquivo(url, texto) {
    return url ? `<a class="ver-arquivo" href="${esc(url)}" onclick="return abrirAnexo(event, this.href)">${ICONE_CLIPE} ${texto}</a>` : '';
  }

  function desenharContrato() {
    const { obra, contrato: c, aditivos, venda, podeEditar, podeAprovarAditivo, comercialEnviado } = estado.contrato;
    const passo = Math.max(0, PASSOS_CONTRATO.indexOf(c.Passo));
    const assinado = c.Passo === 'Assinado';
    const admin = estado.usuario.Nivel === 'Administrador';
    const editavelDados = podeEditar && (!assinado || admin);

    const passos = PASSOS_CONTRATO.map((nome, i) => {
      const feito = i < passo || assinado;
      const cls = feito ? 'feito' : i === passo ? 'atual' : '';
      const linha = i < PASSOS_CONTRATO.length - 1 ? `<div class="linha-passo ${i < passo ? 'feito' : ''}"></div>` : '';
      return `<div class="passo ${cls}"><span class="bola">${feito ? '✓' : i + 1}</span>${nome}</div>${linha}`;
    }).join('');

    // O que falta para avançar
    let aviso;
    if (assinado) {
      aviso = `<div class="aviso ok">Contrato assinado em ${dataBR(c.DataAssinatura)}. A Engenharia foi liberada. Mudanças agora são feitas por aditivo.</div>`;
    } else if (!podeEditar) {
      aviso = `<div class="aviso info">Você está vendo o contrato apenas para consulta.</div>`;
    } else if (passo === 0) {
      const falta = [];
      if (!c.Numero) falta.push('o número');
      if (!c.InicioOficial || !c.EntregaOficial) falta.push('as datas oficiais');
      if (!c.ArquivoMinuta) falta.push('a minuta em PDF');
      aviso = falta.length
        ? `<div class="aviso">Falta preencher ${falta.join(', ')} para enviar ao cliente assinar.</div>`
        : `<div class="aviso info">Tudo pronto. Quando enviar a minuta ao cliente, clique em "Enviar para assinatura".</div>`;
    } else {
      aviso = `<div class="aviso">Aguardando o cliente assinar. Quando receber, anexe o contrato assinado.</div>`;
    }
    const avisoComercial = !comercialEnviado && !assinado
      ? `<div class="aviso info">O Comercial ainda não concluiu a ficha desta obra. Você pode adiantar o contrato mesmo assim.</div>` : '';

    const campo = (nome, rotulo, tipo, valor) => editavelDados
      ? `<div class="campo"><label for="ct-${nome}">${rotulo}</label>
           <input id="ct-${nome}" name="${nome}" type="${tipo}" value="${esc(valor)}"></div>`
      : `<div class="campo"><label>${rotulo}</label><div class="valor">${tipo === 'date' ? dataBR(valor) : esc(valor) || '—'}</div></div>`;
    const prazo = c.InicioOficial && c.EntregaOficial
      ? Math.round((Date.parse(c.EntregaOficial) - Date.parse(c.InicioOficial)) / 864e5) + ' dias corridos' : '—';

    // Arquivos: minuta e assinado
    let arquivos = `<div class="arquivo-linha">
        <div><strong>Minuta</strong><div class="suave pequeno">Versão enviada ao cliente</div></div>
        <div class="anexo">${linkArquivo(c.ArquivoMinuta, 'Ver minuta')}
          ${podeEditar && !assinado ? `<input type="file" id="arq-minuta" accept=".pdf" hidden onchange="enviarArquivoContrato('minuta', this)">
            <button class="botao pequeno" onclick="document.getElementById('arq-minuta').click()">${c.ArquivoMinuta ? 'Trocar' : 'Anexar PDF'}</button>` : ''}
          ${!c.ArquivoMinuta && !(podeEditar && !assinado) ? '<span class="suave">Sem arquivo</span>' : ''}
        </div></div>`;
    arquivos += `<div class="arquivo-linha">
        <div><strong>Contrato assinado</strong><div class="suave pequeno">${assinado ? 'Assinado em ' + dataBR(c.DataAssinatura) : 'Anexe quando o cliente assinar'}</div></div>
        <div class="anexo">${linkArquivo(c.ArquivoAssinado, 'Ver contrato assinado')}
          ${!c.ArquivoAssinado ? '<span class="suave">Ainda não anexado</span>' : ''}</div></div>`;

    // Ações do passo atual
    let acoes = '';
    if (podeEditar && !assinado) {
      acoes = passo === 0
        ? `<button class="botao" onclick="salvarDadosContrato()">Salvar</button>
           <button class="botao primario" onclick="mudarPasso('Aguardando assinatura')">Enviar para assinatura →</button>`
        : `<button class="botao" onclick="mudarPasso('Em elaboração')">← Voltar para elaboração</button>
           <button class="botao" onclick="salvarDadosContrato()">Salvar</button>`;
    } else if (editavelDados) {
      acoes = `<button class="botao" onclick="salvarDadosContrato()">Salvar (administrador)</button>`;
    }
    const blocoAssinado = podeEditar && passo === 1 ? `
      <div class="cartao secao destaque-acao">
        <h2>Contrato assinado chegou?</h2>
        <div class="campos">
          <div class="campo"><label for="ct-data-ass">Data de assinatura</label><input id="ct-data-ass" type="date" value="${hojeISO()}"></div>
          <div class="campo"><label for="arq-assinado">PDF assinado</label><input id="arq-assinado" type="file" accept=".pdf"></div>
        </div>
        <div class="acoes"><button class="botao sucesso" id="btn-assinado" onclick="anexarAssinado()">Anexar e concluir contrato</button></div>
      </div>` : '';

    // Aditivos
    const linhasAditivos = aditivos.map(a => {
      const pendente = a.Situacao === 'Aguardando aprovação do Gestor';
      return `<tr>
        <td class="num">${esc(a.Numero)}</td><td class="num">${dataBR(a.Data)}</td><td>${esc(a.Descricao)}</td>
        <td class="num">${dinheiro(a.Valor)}</td>
        <td>${etiqueta(pendente ? 'Aguardando Gestor' : a.Situacao)}</td>
        <td>${linkArquivo(a.Arquivo, 'Arquivo')}
          ${pendente && podeAprovarAditivo ? `<div class="acoes-linha">
            <button class="botao pequeno" onclick="decidirAditivo('${a.ID_Aditivo}', false)">Recusar</button>
            <button class="botao pequeno sucesso" onclick="decidirAditivo('${a.ID_Aditivo}', true)">Aprovar</button></div>` : ''}</td>
      </tr>`;
    }).join('');
    const formAditivo = estado.novoAditivo ? `
      <div class="form-inline" id="form-aditivo">
        <div class="campos">
          <div class="campo largo"><label for="ad-desc">Descrição</label><input id="ad-desc" placeholder="Ex.: Inclusão de churrasqueira"></div>
          <div class="campo"><label for="ad-valor">Valor (R$)</label><input id="ad-valor" type="number" min="0" step="0.01"></div>
          <div class="campo"><label for="ad-arq">Arquivo (opcional)</label><input id="ad-arq" type="file" accept=".pdf"></div>
        </div>
        <div class="acoes"><button class="botao" onclick="estado.novoAditivo=false; desenharContrato()">Cancelar</button>
          <button class="botao primario" id="btn-aditivo" onclick="salvarAditivo()">Registrar aditivo</button></div>
      </div>` : '';

    tela(`
      <a class="link-voltar" onclick="irPara('#/obra/${obra.ID_Obra}')">← Voltar para a obra ${esc(obra.Codigo)}</a>
      <div class="cabecalho-obra">
        <div>
          <div class="codigo">${esc(obra.Codigo)} · CONTRATO</div>
          <h1>${esc(obra.Cliente)}</h1>
          <div class="etiquetas">${etiqueta(c.Passo)}</div>
        </div>
      </div>

      <div class="cartao secao">
        <div class="passos">${passos}</div>
      </div>
      ${aviso}${avisoComercial}

      <div class="duas-colunas">
        <div>
          <div class="cartao secao">
            <h2>Contrato${c.Numero ? ' nº ' + esc(c.Numero) : ''}</h2>
            <div class="campos" id="form-contrato">
              ${campo('Numero', 'Número do contrato', 'text', c.Numero)}
              ${campo('InicioOficial', 'Início oficial', 'date', c.InicioOficial)}
              ${campo('EntregaOficial', 'Entrega oficial', 'date', c.EntregaOficial)}
              <div class="campo"><label>Prazo</label><div class="valor">${prazo}</div></div>
              ${editavelDados
                ? `<div class="campo largo"><label for="ct-Observacoes">Observações</label><textarea id="ct-Observacoes" name="Observacoes">${esc(c.Observacoes)}</textarea></div>`
                : `<div class="campo largo"><label>Observações</label><div class="valor">${esc(c.Observacoes) || '—'}</div></div>`}
            </div>
            <p class="suave pequeno">A entrega oficial é a referência para marcar a obra como atrasada.</p>
            <h3 class="subtitulo">Documentos</h3>
            ${arquivos}
            ${acoes ? `<div class="acoes">${acoes}</div>` : ''}
          </div>
          ${blocoAssinado}

          <div class="cartao secao">
            <div class="cabecalho-obra" style="margin-bottom:8px"><h2>Aditivos</h2>
              ${assinado && podeEditar && !estado.novoAditivo ? `<button class="botao pequeno" onclick="estado.novoAditivo=true; desenharContrato()">+ Novo aditivo</button>` : ''}</div>
            ${formAditivo}
            ${aditivos.length ? `<div class="tabela-rolavel"><table class="tabela">
              <thead><tr><th>Nº</th><th>Data</th><th>Descrição</th><th>Valor</th><th>Situação</th><th></th></tr></thead>
              <tbody>${linhasAditivos}</tbody></table></div>`
              : `<p class="suave">${assinado ? 'Nenhum aditivo.' : 'Aditivos podem ser criados depois que o contrato for assinado.'}</p>`}
            <p class="suave pequeno">Cada aditivo passa pela aprovação do Gestor. O contrato original nunca é apagado.</p>
          </div>
        </div>

        <aside class="cartao secao">
          <div class="rotulo-pequeno">Do Comercial · só consulta</div>
          <h2>Dados da venda</h2>
          <dl class="lista-dados">
            <div><dt>Cliente</dt><dd>${esc(venda.NomeCliente) || '—'}</dd></div>
            <div><dt>CPF</dt><dd>${esc(venda.CPF) || '—'}</dd></div>
            <div><dt>Valor fechado</dt><dd>${dinheiro(venda.ValorFechado)}</dd></div>
            <div><dt>Pagamento</dt><dd>${esc(venda.FormaPagamento) || '—'}${venda.Banco && venda.FormaPagamento === 'Financiamento' ? ' · ' + esc(venda.Banco) : ''}
              ${Number(venda.Entrada) ? `<div class="suave pequeno">Entrada de ${dinheiro(venda.Entrada)}</div>` : ''}
              ${venda.FormaPagamento === 'Parcelado direto' && venda.QtdParcelas ? `<div class="suave pequeno">${venda.QtdParcelas}x de ${dinheiro(venda.ValorParcela)}
                · ${Number(venda.JurosMensal) ? String(venda.JurosMensal).replace('.', ',') + '% ao mês' : 'sem juros'}</div>` : ''}
              ${venda.FormaPagamento === 'Financiamento' && Number(venda.ValorFechado) ? `<div class="suave pequeno">Financiado: ${dinheiro(Number(venda.ValorFechado) - (Number(venda.Entrada) || 0))}</div>` : ''}</dd></div>
            <div><dt>Prazo prometido ao cliente</dt><dd>${dataBR(venda.PrazoPrometido)}</dd></div>
            <div><dt>Personalizações</dt><dd>${esc(venda.Personalizacoes) || '—'}</dd></div>
          </dl>
        </aside>
      </div>
    `);
  }

  function hojeISO() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function dadosDoContrato() {
    const ler = id => { const el = document.getElementById('ct-' + id); return el ? el.value.trim() : undefined; };
    return { Numero: ler('Numero'), InicioOficial: ler('InicioOficial'), EntregaOficial: ler('EntregaOficial'), Observacoes: ler('Observacoes') };
  }

  // Recarrega a tela do contrato depois de uma ação
  async function recarregarContrato(mensagem) {
    if (mensagem) mostrarMensagem(mensagem);
    estado.contrato = await chamar('abrirContrato', estado.contrato.obra.ID_Obra, auth());
    desenharContrato();
  }

  function travarBotoes(travar) {
    document.querySelectorAll('#tela .botao').forEach(b => { b.disabled = travar; });
  }

  async function salvarDadosContrato(silencioso) {
    travarBotoes(true);
    try {
      await chamar('salvarContrato', estado.contrato.obra.ID_Obra, dadosDoContrato(), auth());
      if (!silencioso) await recarregarContrato('Contrato salvo!');
      return true;
    } catch (erro) { mostrarErro(erro); travarBotoes(false); return false; }
  }

  async function mudarPasso(passo) {
    // Antes de enviar, grava o que foi digitado
    if (document.getElementById('ct-Numero') && !(await salvarDadosContrato(true))) return;
    travarBotoes(true);
    try {
      await chamar('mudarPassoContrato', estado.contrato.obra.ID_Obra, passo, auth());
      await recarregarContrato(passo === 'Aguardando assinatura' ? 'Contrato enviado para assinatura.' : 'Contrato voltou para elaboração.');
    } catch (erro) { mostrarErro(erro); await recarregarContrato(); }
  }

  async function enviarArquivoContrato(tipo, campo) {
    if (!campo.files[0]) return;
    travarBotoes(true);
    try {
      if (document.getElementById('ct-Numero')) await chamar('salvarContrato', estado.contrato.obra.ID_Obra, dadosDoContrato(), auth());
      const arquivo = await lerArquivo(campo.files[0]);
      await chamar('anexarArquivoContrato', estado.contrato.obra.ID_Obra, tipo, arquivo, '', auth());
      await recarregarContrato('Minuta anexada!');
    } catch (erro) { mostrarErro(erro); travarBotoes(false); }
  }

  async function anexarAssinado() {
    const campo = document.getElementById('arq-assinado');
    const data = document.getElementById('ct-data-ass').value;
    if (!campo.files[0]) return mostrarMensagem('Escolha o PDF do contrato assinado.', 'erro');
    if (!data) return mostrarMensagem('Informe a data de assinatura.', 'erro');
    if (!confirm('Concluir o contrato? A Engenharia será liberada e mudanças passam a ser feitas por aditivo.')) return;
    travarBotoes(true);
    document.getElementById('btn-assinado').textContent = 'Enviando…';
    try {
      const arquivo = await lerArquivo(campo.files[0]);
      await chamar('anexarArquivoContrato', estado.contrato.obra.ID_Obra, 'assinado', arquivo, data, auth());
      await recarregarContrato('Contrato assinado! A Engenharia foi liberada.');
    } catch (erro) { mostrarErro(erro); travarBotoes(false); }
  }

  async function salvarAditivo() {
    const descricao = document.getElementById('ad-desc').value.trim();
    if (!descricao) return mostrarMensagem('Descreva o aditivo.', 'erro');
    travarBotoes(true);
    try {
      const campo = document.getElementById('ad-arq');
      const arquivo = campo.files[0] ? await lerArquivo(campo.files[0]) : null;
      await chamar('criarAditivo', estado.contrato.obra.ID_Obra,
        { Descricao: descricao, Valor: document.getElementById('ad-valor').value }, arquivo, auth());
      estado.novoAditivo = false;
      await recarregarContrato('Aditivo registrado e enviado para aprovação do Gestor.');
    } catch (erro) { mostrarErro(erro); travarBotoes(false); }
  }

  async function decidirAditivo(idAditivo, aprovar) {
    if (!confirm(aprovar ? 'Aprovar este aditivo?' : 'Recusar este aditivo?')) return;
    travarBotoes(true);
    try {
      await chamar('decidirAditivo', idAditivo, aprovar, auth());
      await recarregarContrato(aprovar ? 'Aditivo aprovado.' : 'Aditivo recusado.');
    } catch (erro) { mostrarErro(erro); travarBotoes(false); }
  }

  /* =========================================================
   * TELA 8 – Setor Engenharia ("a pasta técnica")
   * Abas internas: Projetos, Documentos técnicos, Cronograma,
   * Orçamento, Materiais, Especificações
   * ========================================================= */
  const ABAS_ENG = [
    ['projetos', 'Projetos'], ['documentos', 'Documentos técnicos'], ['cronograma', 'Cronograma'],
    ['orcamento', 'Orçamento'], ['materiais', 'Materiais'], ['especificacoes', 'Especificações']
  ];

  async function telaEngenharia(idObra) {
    carregando('Abrindo Engenharia…');
    try {
      estado.eng = await chamar('abrirEngenharia', idObra, auth());
      if (!estado.abaEng) estado.abaEng = 'projetos';
      estado.engAlterado = false;
      estado.linhasMateriais = null;
      desenharEngenharia();
    } catch (erro) { mostrarErro(erro); irPara('#/obra/' + idObra); }
  }

  async function recarregarEngenharia(mensagem) {
    if (mensagem) mostrarMensagem(mensagem);
    estado.eng = await chamar('abrirEngenharia', estado.eng.obra.ID_Obra, auth());
    estado.engAlterado = false;
    estado.linhasMateriais = null;
    desenharEngenharia();
  }

  function trocarAbaEng(aba) {
    if (estado.engAlterado && !confirm('Há alterações não salvas nesta aba. Sair sem salvar?')) return;
    estado.abaEng = aba;
    estado.engAlterado = false;
    estado.linhasMateriais = null;
    desenharEngenharia();
  }

  // O que falta para liberar para Compras (mesma regra do servidor)
  function pendenciasEng() {
    const { cronograma, materiais } = estado.eng;
    const falta = [];
    const cronoOk = cronograma.length === 6 && cronograma.every(c => c.Salvo && c.InicioPrevisto && c.FimPrevisto);
    const semData = materiais.filter(m => !m.DataNecessaria && !(cronograma.find(c => c.Etapa === m.Etapa) || {}).InicioPrevisto);
    return [
      ['Cronograma salvo com as datas de todas as etapas', cronoOk],
      ['Lista de materiais cadastrada', materiais.length > 0],
      ['Todos os materiais com data de chegada no canteiro', materiais.length > 0 && !semData.length]
    ];
  }

  function desenharEngenharia() {
    const { obra, eng, podeEditar } = estado.eng;
    const liberado = eng.Situacao === 'Liberado para Compras';
    const itens = pendenciasEng();
    const pronto = itens.every(i => i[1]);

    const checklist = liberado
      ? `<div class="aviso ok">Liberado para Compras em ${dataBR(eng.LiberadoEm)}. Material novo incluído agora vai direto para Compras.</div>`
      : `<div class="cartao secao">
          <div class="cabecalho-obra" style="margin-bottom:6px"><h2>Para liberar para Compras</h2>
            ${podeEditar ? `<button class="botao sucesso" ${pronto ? '' : 'disabled'} onclick="liberarCompras()">Liberar para Compras →</button>` : ''}</div>
          <ul class="checklist-pronto">${itens.map(([t, ok]) => `<li class="${ok ? 'ok' : ''}">${ok ? '✓' : '○'} ${t}</li>`).join('')}</ul>
          <p class="suave pequeno">Projetos e documentos técnicos podem continuar sendo atualizados depois da liberação.</p>
        </div>`;

    const abas = ABAS_ENG.map(([id, nome]) =>
      `<button class="aba-interna ${estado.abaEng === id ? 'ativa' : ''}" onclick="trocarAbaEng('${id}')">${nome}</button>`).join('');

    const conteudo = {
      projetos: engProjetos, documentos: engDocumentos, cronograma: engCronograma,
      orcamento: engOrcamento, materiais: engMateriais, especificacoes: engEspecificacoes
    }[estado.abaEng]();

    tela(`
      <a class="link-voltar" onclick="irPara('#/obra/${obra.ID_Obra}')">← Voltar para a obra ${esc(obra.Codigo)}</a>
      <div class="cabecalho-obra">
        <div>
          <div class="codigo">${esc(obra.Codigo)} · ENGENHARIA</div>
          <h1>${esc(obra.Cliente)}</h1>
          <div class="suave">${esc(obra.ModeloCasa) || 'Modelo da casa não informado'}</div>
          <div class="etiquetas">${etiqueta(liberado ? 'Liberado para Compras' : eng.AtualizadoEm ? 'Em elaboração' : 'Não iniciado')}</div>
        </div>
      </div>
      ${!podeEditar ? `<div class="aviso info">Você está vendo a Engenharia apenas para consulta.</div>` : ''}
      ${checklist}
      <div class="abas-internas">${abas}</div>
      <div id="conteudo-eng" oninput="estado.engAlterado = true">${conteudo}</div>
    `);
  }

  /* ---------- Projetos ---------- */
  function engProjetos() {
    const { projetos, disciplinas, podeEditar } = estado.eng;
    return `<div class="grade-cartoes">${disciplinas.map((d, i) => {
      const versoes = projetos.filter(p => p.Disciplina === d).sort((a, b) => b.Versao - a.Versao);
      const atual = versoes[0];
      return `<div class="cartao">
        <div class="cabecalho-obra" style="margin-bottom:8px"><h3>${esc(d)}</h3>
          ${atual ? `<span class="etiqueta st-concluido">v${atual.Versao}</span>` : '<span class="etiqueta st-nao-iniciado">Sem projeto</span>'}</div>
        ${atual ? `<div class="pequeno">${dataBR(atual.Data)}${atual.Observacao ? ' · ' + esc(atual.Observacao) : ''}</div>
          <div style="margin:6px 0">${linkArquivo(atual.Arquivo, 'Ver versão atual') || '<span class="suave pequeno">Arquivo não anexado</span>'}</div>` : ''}
        ${versoes.length > 1 ? `<details class="pequeno"><summary>Versões anteriores (${versoes.length - 1})</summary>
          <ul class="lista-simples">${versoes.slice(1).map(v => `<li>v${v.Versao} · ${dataBR(v.Data)}${v.Observacao ? ' · ' + esc(v.Observacao) : ''} ${linkArquivo(v.Arquivo, 'Ver')}</li>`).join('')}</ul></details>` : ''}
        ${podeEditar ? `<div class="envio-versao">
          <input type="file" id="proj-arq-${i}" accept=".pdf,.dwg,image/*">
          <input id="proj-obs-${i}" placeholder="O que mudou nesta versão? (opcional)">
          <button class="botao pequeno primario" onclick="enviarVersaoProjeto(${i})">Enviar ${atual ? 'nova versão' : 'projeto'}</button>
        </div>` : ''}
      </div>`;
    }).join('')}</div>`;
  }

  async function enviarVersaoProjeto(i) {
    const campo = document.getElementById('proj-arq-' + i);
    if (!campo.files[0]) return mostrarMensagem('Escolha o arquivo do projeto.', 'erro');
    travarBotoes(true);
    try {
      const arquivo = await lerArquivo(campo.files[0]);
      await chamar('enviarProjeto', estado.eng.obra.ID_Obra, estado.eng.disciplinas[i], arquivo,
        document.getElementById('proj-obs-' + i).value, auth());
      await recarregarEngenharia('Projeto enviado!');
    } catch (erro) { mostrarErro(erro); travarBotoes(false); }
  }

  /* ---------- Documentos técnicos + responsável ---------- */
  function engDocumentos() {
    const { eng, docs, situacoesDoc, podeEditar } = estado.eng;
    const linhas = docs.map((d, i) => `<tr>
      <td><strong>${esc(d.Tipo)}</strong></td>
      <td>${podeEditar ? `<select id="doc-sit-${i}">${situacoesDoc.map(s => `<option ${s === d.Situacao ? 'selected' : ''}>${s}</option>`).join('')}</select>` : etiqueta(d.Situacao)}</td>
      <td>${podeEditar ? `<input id="doc-num-${i}" value="${esc(d.Numero)}" placeholder="Número/protocolo">` : esc(d.Numero) || '—'}</td>
      <td>${linkArquivo(d.Arquivo, 'Ver') || (podeEditar ? '' : '<span class="suave">—</span>')}
        ${podeEditar ? `<input type="file" id="doc-arq-${i}" accept=".pdf,image/*" class="arquivo-pequeno">` : ''}</td>
      <td>${podeEditar ? `<button class="botao pequeno" onclick="salvarDocTec(${i})">Salvar</button>` : ''}</td>
    </tr>`).join('');
    return `
      <div class="cartao secao">
        <h2>Responsável técnico</h2>
        <div class="campos">
          ${campoEng('RespTecnico', 'Nome', eng.RespTecnico)}
          ${campoEng('RegistroTecnico', 'Registro (CREA ou CAU)', eng.RegistroTecnico)}
        </div>
        ${podeEditar ? `<div class="acoes"><button class="botao" onclick="salvarCamposEng(['RespTecnico','RegistroTecnico'])">Salvar responsável</button></div>` : ''}
      </div>
      <div class="cartao secao tabela-rolavel">
        <h2>Documentos legais</h2>
        <table class="tabela"><thead><tr><th>Documento</th><th>Situação</th><th>Número</th><th>Arquivo</th><th></th></tr></thead>
        <tbody>${linhas}</tbody></table>
      </div>`;
  }

  function campoEng(nome, rotulo, valor, tipo = 'text', largo = false) {
    const podeEditar = estado.eng.podeEditar;
    let conteudo;
    if (!podeEditar) conteudo = `<div class="valor">${tipo === 'date' ? dataBR(valor) : esc(valor) || '—'}</div>`;
    else if (tipo === 'textarea') conteudo = `<textarea id="eng-${nome}">${esc(valor)}</textarea>`;
    else conteudo = `<input id="eng-${nome}" type="${tipo}" value="${esc(valor)}">`;
    return `<div class="campo ${largo ? 'largo' : ''}"><label for="eng-${nome}">${rotulo}</label>${conteudo}</div>`;
  }

  async function salvarCamposEng(campos) {
    const dados = {};
    campos.forEach(c => { dados[c] = document.getElementById('eng-' + c).value; });
    travarBotoes(true);
    try {
      await chamar('salvarDadosEngenharia', estado.eng.obra.ID_Obra, dados, auth());
      await recarregarEngenharia('Salvo!');
    } catch (erro) { mostrarErro(erro); travarBotoes(false); }
  }

  async function salvarDocTec(i) {
    const doc = estado.eng.docs[i];
    const campo = document.getElementById('doc-arq-' + i);
    travarBotoes(true);
    try {
      const arquivo = campo.files[0] ? await lerArquivo(campo.files[0]) : null;
      await chamar('salvarDocTecnico', estado.eng.obra.ID_Obra, doc.Tipo, {
        Situacao: document.getElementById('doc-sit-' + i).value, Numero: document.getElementById('doc-num-' + i).value
      }, arquivo, auth());
      await recarregarEngenharia(doc.Tipo + ' salvo!');
    } catch (erro) { mostrarErro(erro); travarBotoes(false); }
  }

  /* ---------- Cronograma (com barras) ---------- */
  function engCronograma() {
    const { cronograma, podeEditar } = estado.eng;
    const datas = cronograma.flatMap(c => [c.InicioPrevisto, c.FimPrevisto]).filter(Boolean).sort();
    const ini = Date.parse(datas[0]), fim = Date.parse(datas[datas.length - 1]);
    const total = fim - ini;
    const barra = c => {
      if (!c.InicioPrevisto || !c.FimPrevisto || !(total > 0)) return '';
      const esq = (Date.parse(c.InicioPrevisto) - ini) / total * 100;
      const larg = Math.max((Date.parse(c.FimPrevisto) - Date.parse(c.InicioPrevisto)) / total * 100, 1.5);
      return `<div class="gantt"><div class="gantt-barra" style="left:${esq}%; width:${larg}%"></div></div>`;
    };
    const soma = cronograma.reduce((s, c) => s + (Number(c.Peso) || 0), 0);
    const linhas = cronograma.map((c, i) => `<tr>
      <td><strong>${esc(c.Etapa)}</strong></td>
      <td>${podeEditar ? `<input id="cr-peso-${i}" type="number" min="0" max="100" value="${esc(c.Peso)}" class="input-curto" oninput="atualizarSomaPesos()">` : c.Peso}%</td>
      <td>${podeEditar ? `<input id="cr-ini-${i}" type="date" value="${esc(c.InicioPrevisto)}">` : dataBR(c.InicioPrevisto)}</td>
      <td>${podeEditar ? `<input id="cr-fim-${i}" type="date" value="${esc(c.FimPrevisto)}">` : dataBR(c.FimPrevisto)}</td>
      <td class="coluna-gantt">${barra(c)}</td>
    </tr>`).join('');
    const sugerido = cronograma.length && !cronograma[0].Salvo;
    return `<div class="cartao secao">
      ${sugerido ? `<div class="aviso info">Datas sugeridas a partir do prazo oficial do contrato. Revise e clique em "Salvar cronograma".</div>` : ''}
      <div class="tabela-rolavel"><table class="tabela">
        <thead><tr><th>Etapa física</th><th>Peso</th><th>Início</th><th>Fim</th><th>${datas.length ? dataBR(datas[0]) + ' → ' + dataBR(datas[datas.length - 1]) : ''}</th></tr></thead>
        <tbody>${linhas}</tbody>
      </table></div>
      <p class="pequeno ${soma === 100 ? 'suave' : 'texto-erro'}" id="soma-pesos">Soma dos pesos: ${soma}% ${soma === 100 ? '' : '(precisa dar 100%)'}</p>
      <p class="suave pequeno">O peso de cada etapa define quanto ela vale no andamento físico da obra, que o Fiscal vai atualizar.</p>
      ${podeEditar ? `<div class="acoes"><button class="botao primario" onclick="salvarCronogramaEng('cronograma')">Salvar cronograma</button></div>` : ''}
    </div>`;
  }

  function atualizarSomaPesos() {
    const soma = estado.eng.cronograma.reduce((s, c, i) => s + (Number(document.getElementById('cr-peso-' + i).value) || 0), 0);
    const el = document.getElementById('soma-pesos');
    el.textContent = `Soma dos pesos: ${soma}% ${soma === 100 ? '' : '(precisa dar 100%)'}`;
    el.className = 'pequeno ' + (soma === 100 ? 'suave' : 'texto-erro');
  }

  // Cronograma e orçamento ficam na mesma tabela da planilha: junta o que está na tela com o que já existe
  async function salvarCronogramaEng(origem) {
    const valor = (id, atual) => { const el = document.getElementById(id); return el ? el.value : atual; };
    const linhas = estado.eng.cronograma.map((c, i) => ({
      Etapa: c.Etapa,
      Peso: valor('cr-peso-' + i, c.Peso), InicioPrevisto: valor('cr-ini-' + i, c.InicioPrevisto), FimPrevisto: valor('cr-fim-' + i, c.FimPrevisto),
      OrcMateriais: valor('or-mat-' + i, c.OrcMateriais), OrcMaoObra: valor('or-mo-' + i, c.OrcMaoObra)
    }));
    travarBotoes(true);
    try {
      await chamar('salvarCronograma', estado.eng.obra.ID_Obra, linhas, auth());
      await recarregarEngenharia(origem === 'orcamento' ? 'Orçamento salvo!' : 'Cronograma salvo!');
    } catch (erro) { mostrarErro(erro); travarBotoes(false); }
  }

  /* ---------- Orçamento por etapa ---------- */
  function engOrcamento() {
    const { cronograma, podeEditar } = estado.eng;
    const n = v => Number(v) || 0;
    const linhas = cronograma.map((c, i) => `<tr>
      <td><strong>${esc(c.Etapa)}</strong></td>
      <td>${podeEditar ? `<input id="or-mat-${i}" type="number" min="0" step="0.01" value="${esc(c.OrcMateriais)}" oninput="atualizarTotaisOrc()">` : dinheiro(c.OrcMateriais)}</td>
      <td>${podeEditar ? `<input id="or-mo-${i}" type="number" min="0" step="0.01" value="${esc(c.OrcMaoObra)}" oninput="atualizarTotaisOrc()">` : dinheiro(c.OrcMaoObra)}</td>
      <td class="num" id="or-tot-${i}">${dinheiro(n(c.OrcMateriais) + n(c.OrcMaoObra))}</td>
    </tr>`).join('');
    const tm = cronograma.reduce((s, c) => s + n(c.OrcMateriais), 0), to = cronograma.reduce((s, c) => s + n(c.OrcMaoObra), 0);
    return `<div class="cartao secao">
      <div class="tabela-rolavel"><table class="tabela">
        <thead><tr><th>Etapa física</th><th>Materiais (R$)</th><th>Mão de obra (R$)</th><th>Total</th></tr></thead>
        <tbody>${linhas}</tbody>
        <tfoot><tr><th>Total da obra</th><th class="num" id="or-tm">${dinheiro(tm)}</th><th class="num" id="or-to">${dinheiro(to)}</th><th class="num" id="or-tt">${dinheiro(tm + to)}</th></tr></tfoot>
      </table></div>
      <p class="suave pequeno">O Financeiro vai comparar este previsto com o gasto real de cada etapa.</p>
      ${podeEditar ? `<div class="acoes"><button class="botao primario" onclick="salvarCronogramaEng('orcamento')">Salvar orçamento</button></div>` : ''}
    </div>`;
  }

  function atualizarTotaisOrc() {
    let tm = 0, to = 0;
    estado.eng.cronograma.forEach((c, i) => {
      const m = Number(document.getElementById('or-mat-' + i).value) || 0, o = Number(document.getElementById('or-mo-' + i).value) || 0;
      tm += m; to += o;
      document.getElementById('or-tot-' + i).textContent = dinheiro(m + o);
    });
    document.getElementById('or-tm').textContent = dinheiro(tm);
    document.getElementById('or-to').textContent = dinheiro(to);
    document.getElementById('or-tt').textContent = dinheiro(tm + to);
  }

  /* ---------- Materiais ---------- */
  function materialTravado(m) { return m.Situacao && m.Situacao !== 'Rascunho' && m.Situacao !== 'Solicitado'; }

  function engMateriais() {
    const { materiais, etapasFisicas, cronograma, podeEditar, modeloTemPadrao, obra } = estado.eng;
    if (!estado.linhasMateriais) estado.linhasMateriais = materiais.map(m => ({ ...m }));
    const inicioEtapa = etapa => (cronograma.find(c => c.Etapa === etapa) || {}).InicioPrevisto;
    const linhas = estado.linhasMateriais.map((m, i) => {
      const travado = !podeEditar || materialTravado(m);
      const opcoes = etapasFisicas.map(e => `<option ${e === m.Etapa ? 'selected' : ''}>${e}</option>`).join('');
      const dica = inicioEtapa(m.Etapa) ? 'Início da etapa: ' + dataBR(inicioEtapa(m.Etapa)) : '';
      return travado ? `<tr>
          <td>${esc(m.Material)}</td><td class="num">${esc(m.Quantidade)}</td><td>${esc(m.Unidade)}</td><td>${esc(m.Etapa)}</td>
          <td class="num">${dataBR(m.DataNecessaria || inicioEtapa(m.Etapa))}</td>
          <td>${etiqueta(m.Situacao === 'Rascunho' ? 'Rascunho' : m.Situacao)}</td><td></td></tr>`
        : `<tr>
          <td><input id="mt-nome-${i}" value="${esc(m.Material)}" placeholder="Material"></td>
          <td><input id="mt-qtd-${i}" type="number" min="0" step="any" value="${esc(m.Quantidade)}" class="input-curto"></td>
          <td><input id="mt-un-${i}" value="${esc(m.Unidade)}" class="input-curto" placeholder="un"></td>
          <td><select id="mt-etapa-${i}"><option value="">Etapa…</option>${opcoes}</select></td>
          <td><input id="mt-data-${i}" type="date" value="${esc(m.DataNecessaria)}" title="${esc(dica)}"></td>
          <td>${m.Situacao ? etiqueta(m.Situacao) : '<span class="etiqueta st-em-andamento">Novo</span>'}</td>
          <td><button class="botao pequeno perigo" title="Remover" onclick="removerLinhaMaterial(${i})">✕</button></td></tr>`;
    }).join('');
    return `<div class="cartao secao">
      <div class="cabecalho-obra" style="margin-bottom:8px">
        <div><h2>Lista de materiais</h2><div class="suave pequeno">${estado.linhasMateriais.length} itens · data em branco = início da etapa no cronograma</div></div>
        ${podeEditar && modeloTemPadrao ? `<button class="botao" onclick="importarPadrao()">Importar lista padrão do modelo ${esc(obra.ModeloCasa)}</button>` : ''}
      </div>
      <div class="tabela-rolavel"><table class="tabela tabela-materiais">
        <thead><tr><th>Material</th><th>Qtd.</th><th>Unid.</th><th>Etapa</th><th>Chegar até</th><th>Situação</th><th></th></tr></thead>
        <tbody>${linhas || '<tr><td colspan="7" class="suave">Nenhum material ainda.</td></tr>'}</tbody>
      </table></div>
      ${podeEditar ? `<div class="acoes">
        <button class="botao" onclick="adicionarLinhaMaterial()">+ Adicionar material</button>
        <button class="botao primario" onclick="salvarListaMateriais()">Salvar lista</button></div>` : ''}
      <p class="suave pequeno">Materiais que Compras já começou a cotar ficam travados aqui.</p>
    </div>`;
  }

  // Guarda o que foi digitado nas linhas antes de redesenhar
  function lerLinhasMateriais() {
    estado.linhasMateriais = estado.linhasMateriais.map((m, i) => {
      const el = document.getElementById('mt-nome-' + i);
      if (!el) return m;
      return { ...m, Material: el.value, Quantidade: document.getElementById('mt-qtd-' + i).value,
        Unidade: document.getElementById('mt-un-' + i).value, Etapa: document.getElementById('mt-etapa-' + i).value,
        DataNecessaria: document.getElementById('mt-data-' + i).value };
    });
  }

  function adicionarLinhaMaterial() {
    lerLinhasMateriais();
    estado.linhasMateriais.push({ Material: '', Quantidade: '', Unidade: '', Etapa: '', DataNecessaria: '' });
    estado.engAlterado = true;
    desenharEngenharia();
    const i = estado.linhasMateriais.length - 1;
    document.getElementById('mt-nome-' + i).focus();
  }

  function removerLinhaMaterial(i) {
    lerLinhasMateriais();
    estado.linhasMateriais.splice(i, 1);
    estado.engAlterado = true;
    desenharEngenharia();
  }

  async function salvarListaMateriais() {
    lerLinhasMateriais();
    travarBotoes(true);
    try {
      await chamar('salvarMateriais', estado.eng.obra.ID_Obra, estado.linhasMateriais.filter(m => String(m.Material).trim()), auth());
      estado.linhasMateriais = null;
      await recarregarEngenharia('Lista de materiais salva!');
    } catch (erro) { mostrarErro(erro); travarBotoes(false); }
  }

  async function importarPadrao() {
    if (estado.engAlterado && !confirm('A lista tem alterações não salvas, que serão perdidas. Importar mesmo assim?')) return;
    travarBotoes(true);
    try {
      const n = await chamar('importarMateriaisPadrao', estado.eng.obra.ID_Obra, auth());
      estado.linhasMateriais = null;
      await recarregarEngenharia(n ? n + ' materiais importados. Revise as quantidades.' : 'Todos os materiais da lista padrão já estavam na obra.');
    } catch (erro) { mostrarErro(erro); travarBotoes(false); }
  }

  /* ---------- Especificações + visita ao terreno ---------- */
  function engEspecificacoes() {
    const { eng, fotosVisita, podeEditar } = estado.eng;
    return `
      <div class="cartao secao">
        <h2>Especificações da casa</h2>
        <div class="campos">
          ${campoEng('Acabamentos', 'Acabamentos', eng.Acabamentos, 'textarea', true)}
          ${campoEng('Revestimentos', 'Revestimentos', eng.Revestimentos, 'textarea', true)}
          ${campoEng('Loucas', 'Louças e metais', eng.Loucas, 'textarea', true)}
          ${campoEng('Esquadrias', 'Esquadrias (portas e janelas)', eng.Esquadrias, 'textarea', true)}
        </div>
        ${podeEditar ? `<div class="acoes"><button class="botao primario" onclick="salvarCamposEng(['Acabamentos','Revestimentos','Loucas','Esquadrias'])">Salvar especificações</button></div>` : ''}
      </div>
      <div class="cartao secao">
        <h2>Visita ao terreno</h2>
        <div class="campos">
          ${campoEng('VisitaData', 'Data da visita', eng.VisitaData, 'date')}
          ${campoEng('VisitaObservacoes', 'Observações', eng.VisitaObservacoes, 'textarea', true)}
        </div>
        ${podeEditar ? `<div class="acoes"><button class="botao" onclick="salvarCamposEng(['VisitaData','VisitaObservacoes'])">Salvar visita</button></div>` : ''}
        <h3 class="subtitulo">Fotos (${fotosVisita.length})</h3>
        <div class="lista-fotos">${fotosVisita.map(f => `<a class="foto-link" href="${esc(f.Arquivo)}" onclick="return abrirAnexo(event, this.href)">${ICONE_CLIPE} ${esc(f.Nome)}<span class="suave"> · ${dataBR(f.Data)}</span></a>`).join('') || '<span class="suave pequeno">Nenhuma foto.</span>'}</div>
        ${podeEditar ? `<div class="envio-versao"><input type="file" id="fotos-visita" accept="image/*" multiple>
          <button class="botao pequeno primario" onclick="enviarFotosVisita()">Enviar fotos</button></div>` : ''}
      </div>`;
  }

  async function enviarFotosVisita() {
    const campo = document.getElementById('fotos-visita');
    if (!campo.files.length) return mostrarMensagem('Escolha as fotos.', 'erro');
    travarBotoes(true);
    try {
      for (const f of campo.files) {
        await chamar('anexarFotoVisita', estado.eng.obra.ID_Obra, await lerArquivo(f), auth());
      }
      await recarregarEngenharia(campo.files.length + ' foto(s) enviada(s)!');
    } catch (erro) { mostrarErro(erro); travarBotoes(false); }
  }

  async function liberarCompras() {
    if (!confirm('Liberar para Compras? A Engenharia fica concluída e os materiais entram em Compras como "Solicitado".')) return;
    travarBotoes(true);
    try {
      await chamar('liberarParaCompras', estado.eng.obra.ID_Obra, auth());
      await recarregarEngenharia('Liberado para Compras!');
    } catch (erro) { mostrarErro(erro); travarBotoes(false); }
  }

  /* =========================================================
   * TELA 9 – Setor Compras
   * Painel por etapa + lista de materiais + mapa de cotação,
   * pedidos e cadastro de fornecedores
   * ========================================================= */
  const ETAPAS_COMPRA = ['Solicitado', 'Em cotação', 'Aguardando aprovação', 'Pedido feito', 'Entregue'];

  async function telaCompras(idObra) {
    carregando('Abrindo Compras…');
    try {
      estado.compras = await chamar('abrirCompras', idObra, auth());
      estado.abaCompras = estado.abaCompras || 'materiais';
      estado.filtroCompras = 'Todos';
      estado.materialAberto = null;
      estado.cotacaoEscolhida = {};
      estado.fornecedorEditado = null;
      desenharCompras();
    } catch (erro) { mostrarErro(erro); irPara('#/obra/' + idObra); }
  }

  async function recarregarCompras(mensagem) {
    if (mensagem) mostrarMensagem(mensagem);
    estado.compras = await chamar('abrirCompras', estado.compras.obra.ID_Obra, auth());
    desenharCompras();
  }

  function nomeFornecedor(id) {
    const f = estado.compras.fornecedores.find(x => x.ID_Fornecedor === id);
    return f ? f.Nome : '—';
  }

  function somarDias(iso, n) {
    const d = new Date(Date.parse(iso + 'T12:00:00') + n * 864e5);
    return d.toISOString().slice(0, 10);
  }

  function desenharCompras() {
    const { obra, materiais, engenhariaLiberada, podeEditar } = estado.compras;
    const conta = s => materiais.filter(m => m.Situacao === s).length;
    const comprados = conta('Pedido feito') + conta('Entregue');
    const urgentes = materiais.filter(m => m.Urgente);

    const painel = ETAPAS_COMPRA.map(s => `
      <button class="etapa-funil ${estado.filtroCompras === s ? 'ativa' : ''}" onclick="filtrarCompras('${s}')">
        <span class="rotulo-pequeno">${s}</span><span class="qtd">${conta(s)}</span>
      </button>`).join('');

    const alerta = urgentes.length ? `<div class="aviso erro"><strong>Urgente:</strong> ${urgentes.length} material(is) precisa(m) chegar em até 7 dias e ainda não foi(ram) comprado(s):
      ${urgentes.slice(0, 4).map(m => esc(m.Material) + ' (' + dataBR(m.DataNecessaria) + ')').join(', ')}${urgentes.length > 4 ? '…' : ''}</div>` : '';

    const abas = [['materiais', 'Materiais'], ['pedidos', 'Pedidos'], ['fornecedores', 'Fornecedores']].map(([id, nome]) =>
      `<button class="aba-interna ${estado.abaCompras === id ? 'ativa' : ''}" onclick="estado.abaCompras='${id}'; estado.materialAberto=null; desenharCompras()">${nome}</button>`).join('');

    const conteudo = estado.abaCompras === 'pedidos' ? comprasPedidos()
      : estado.abaCompras === 'fornecedores' ? comprasFornecedores() : comprasMateriais();

    tela(`
      <a class="link-voltar" onclick="irPara('#/obra/${obra.ID_Obra}')">← Voltar para a obra ${esc(obra.Codigo)}</a>
      <div class="cabecalho-obra">
        <div>
          <div class="codigo">${esc(obra.Codigo)} · COMPRAS</div>
          <h1>${esc(obra.Cliente)}</h1>
          <div class="suave">${materiais.length ? comprados + ' de ' + materiais.length + ' itens comprados' : 'Nenhum material liberado ainda'}</div>
        </div>
      </div>
      ${!engenhariaLiberada ? `<div class="aviso info">A Engenharia ainda não liberou a lista de materiais desta obra.</div>` : ''}
      ${!podeEditar ? `<div class="aviso info">Você está vendo Compras apenas para consulta.</div>` : ''}
      ${materiais.length ? `<div class="funil">${painel}</div>${alerta}` : ''}
      <div class="abas-internas">${abas}</div>
      ${conteudo}
    `);
  }

  function filtrarCompras(s) {
    estado.filtroCompras = estado.filtroCompras === s ? 'Todos' : s;
    estado.abaCompras = 'materiais';
    estado.materialAberto = null;
    desenharCompras();
  }

  /* ---------- Lista de materiais ---------- */
  function comprasMateriais() {
    const { materiais } = estado.compras;
    const lista = materiais.filter(m => estado.filtroCompras === 'Todos' || m.Situacao === estado.filtroCompras);
    const linhas = lista.map(m => `
      <tr class="linha-clicavel ${estado.materialAberto === m.ID_Material ? 'linha-aberta' : ''}" onclick="abrirMaterial('${m.ID_Material}')">
        <td><strong>${esc(m.Material)}</strong>
          ${m.pedido ? `<div class="suave pequeno">${esc(m.pedido.Numero)} · ${esc(nomeFornecedor(m.pedido.ID_Fornecedor))} · ${dinheiro(m.pedido.Total)}</div>`
            : m.cotacoes.length ? `<div class="suave pequeno">${m.cotacoes.length} cotação(ões)</div>` : ''}</td>
        <td class="num">${Number(m.Quantidade).toLocaleString('pt-BR')} ${esc(m.Unidade)}</td>
        <td>${esc(m.Etapa)}</td>
        <td class="num ${m.Urgente ? 'texto-erro' : ''}">${dataBR(m.DataNecessaria)}</td>
        <td>${etiqueta(m.Situacao)}</td>
      </tr>
      ${estado.materialAberto === m.ID_Material ? `<tr class="linha-detalhe"><td colspan="5">${painelMaterial(m)}</td></tr>` : ''}`).join('');
    return `<div class="cartao tabela-rolavel">
      ${estado.filtroCompras !== 'Todos' ? `<div class="cabecalho-obra" style="margin-bottom:6px"><span class="suave">Mostrando: <strong>${estado.filtroCompras}</strong></span>
        <button class="botao pequeno" onclick="filtrarCompras('${estado.filtroCompras}')">Mostrar todos</button></div>` : ''}
      ${lista.length ? `<table class="tabela">
        <thead><tr><th>Material</th><th>Quantidade</th><th>Etapa</th><th>Chegar até</th><th>Situação</th></tr></thead>
        <tbody>${linhas}</tbody></table>` : `<div class="vazio">Nenhum material aqui.</div>`}
      <p class="suave pequeno">Clique num material para cotar, gerar o pedido, anexar a nota ou registrar a entrega.</p>
    </div>`;
  }

  function abrirMaterial(id) {
    estado.materialAberto = estado.materialAberto === id ? null : id;
    desenharCompras();
  }

  // Painel que abre embaixo do material, conforme a situação dele
  function painelMaterial(m) {
    const { podeEditar, podeAprovar, limiteAprovacao } = estado.compras;
    if (m.Situacao === 'Solicitado' || m.Situacao === 'Em cotação') return mapaCotacao(m);

    const p = m.pedido;
    if (!p) return '<span class="suave">Sem pedido.</span>';
    const dados = `<div class="campos">
      <div class="campo"><label>Pedido</label><div class="valor">${esc(p.Numero)}</div></div>
      <div class="campo"><label>Fornecedor</label><div class="valor">${esc(nomeFornecedor(p.ID_Fornecedor))}</div></div>
      <div class="campo"><label>Total</label><div class="valor num">${dinheiro(p.Total)}</div></div>
      <div class="campo"><label>${m.Situacao === 'Entregue' ? 'Entregue em' : 'Previsão de entrega'}</label>
        <div class="valor num">${dataBR(m.Situacao === 'Entregue' ? p.DataEntrega : p.PrevisaoEntrega)}</div></div>
      <div class="campo"><label>Pagamento</label><div class="valor">${esc(p.Pagamento) || '—'}</div></div>
      <div class="campo"><label>Nota fiscal</label><div class="valor">${p.NumeroNF ? 'Nº ' + esc(p.NumeroNF) + ' ' + linkArquivo(p.ArquivoNF, 'Ver') : '—'}</div></div>
    </div>`;

    if (m.Situacao === 'Aguardando aprovação') {
      return `<div class="painel-material">${dados}
        <div class="aviso">Aguardando aprovação do Gestor.</div>
        ${podeAprovar ? `<div class="acoes"><button class="botao" onclick="decidirPedidoCompra('${p.ID_Pedido}', false)">Recusar (volta para cotação)</button>
          <button class="botao sucesso" onclick="decidirPedidoCompra('${p.ID_Pedido}', true)">Aprovar compra</button></div>` : ''}</div>`;
    }
    if (m.Situacao === 'Pedido feito' && podeEditar) {
      return `<div class="painel-material">${dados}
        <div class="form-inline">
          <div class="campos">
            <div class="campo"><label for="nf-num">Número da nota fiscal</label><input id="nf-num" value="${esc(p.NumeroNF)}"></div>
            <div class="campo"><label for="nf-arq">Arquivo da nota</label><input id="nf-arq" type="file" accept=".pdf,image/*,.xml"></div>
          </div>
          <div class="acoes"><button class="botao" onclick="salvarNotaFiscal('${p.ID_Pedido}')">Salvar nota fiscal</button></div>
        </div>
        <p class="suave pequeno">A entrega deste pedido é programada pela Expedição e confirmada na obra.</p></div>`;
    }
    return `<div class="painel-material">${dados}</div>`;
  }

  /* ---------- Mapa de cotação ---------- */
  function mapaCotacao(m) {
    const { podeEditar, fornecedores, limiteAprovacao, cotacoesRecomendadas, hoje } = estado.compras;
    const total = c => Number(m.Quantidade) * Number(c.PrecoUnitario) + Number(c.Frete);
    const totais = m.cotacoes.map(total);
    const menorTotal = Math.min(...totais), menorUnit = Math.min(...m.cotacoes.map(c => Number(c.PrecoUnitario)));
    let escolhida = estado.cotacaoEscolhida[m.ID_Material];
    if (!m.cotacoes.some(c => c.ID_Cotacao === escolhida)) escolhida = (m.cotacoes[totais.indexOf(menorTotal)] || {}).ID_Cotacao;

    const cards = m.cotacoes.map((c, i) => {
      const chega = somarDias(hoje, Number(c.PrazoDias) || 0);
      const tarde = m.DataNecessaria && chega > m.DataNecessaria;
      return `<div class="proposta ${c.ID_Cotacao === escolhida ? 'escolhida' : ''}" onclick="escolherCotacao('${m.ID_Material}', '${c.ID_Cotacao}')">
        <div class="selos">
          ${totais[i] === menorTotal ? '<span class="etiqueta st-concluido">Menor total</span>' : ''}
          ${Number(c.PrecoUnitario) === menorUnit && m.cotacoes.length > 1 ? '<span class="etiqueta st-em-andamento">Menor preço unitário</span>' : ''}
          ${tarde ? '<span class="etiqueta st-atrasada">Chega tarde</span>' : ''}
        </div>
        <strong>${esc(nomeFornecedor(c.ID_Fornecedor))}</strong>
        <div class="total-proposta num">${dinheiro(totais[i])}</div>
        <dl class="det-proposta num">
          <dt>Preço unitário</dt><dd>${dinheiro(c.PrecoUnitario)}</dd>
          <dt>Frete</dt><dd>${Number(c.Frete) ? dinheiro(c.Frete) : 'Grátis'}</dd>
          <dt>Entrega</dt><dd class="${tarde ? 'texto-erro' : ''}">${dataBR(chega)} (${c.PrazoDias} dias)</dd>
          <dt>Pagamento</dt><dd>${esc(c.Pagamento) || '—'}</dd>
        </dl>
        ${c.Observacao ? `<div class="suave pequeno">${esc(c.Observacao)}</div>` : ''}
        ${podeEditar ? `<button class="link-voltar pequeno" style="margin:0" onclick="event.stopPropagation(); removerCotacaoCompra('${c.ID_Cotacao}')">Remover cotação</button>` : ''}
      </div>`;
    }).join('');

    const usados = m.cotacoes.map(c => c.ID_Fornecedor);
    const opcoes = fornecedores.filter(f => f.Ativo !== false && !usados.includes(f.ID_Fornecedor))
      .map(f => `<option value="${f.ID_Fornecedor}">${esc(f.Nome)}${f.Categoria ? ' · ' + esc(f.Categoria) : ''}</option>`).join('');
    const totalEscolhido = escolhida ? total(m.cotacoes.find(c => c.ID_Cotacao === escolhida)) : 0;

    return `<div class="painel-material">
      <div class="cabecalho-obra" style="margin-bottom:6px"><h3>Mapa de cotação</h3>
        <span class="suave pequeno">${m.cotacoes.length} de ${cotacoesRecomendadas} cotações recomendadas</span></div>
      ${m.cotacoes.length ? `<div class="mapa">${cards}</div>` : '<p class="suave">Nenhuma cotação ainda.</p>'}
      ${podeEditar && m.cotacoes.length ? `<div class="acoes" style="align-items:center">
        <span class="suave pequeno" style="margin-right:auto">${limiteAprovacao === null
          ? 'Compras não precisam de aprovação do Gestor: o pedido sai direto.'
          : totalEscolhido > limiteAprovacao
          ? 'Acima de ' + dinheiro(limiteAprovacao) + ': o pedido vai para aprovação do Gestor.'
          : 'Até ' + dinheiro(limiteAprovacao) + ': o pedido sai direto.'}</span>
        <button class="botao primario" onclick="gerarPedidoCompra('${m.ID_Material}', '${escolhida}')">Gerar pedido com ${esc(nomeFornecedor((m.cotacoes.find(c => c.ID_Cotacao === escolhida) || {}).ID_Fornecedor))}</button>
      </div>` : ''}
      ${podeEditar && opcoes ? `<div class="form-inline" style="margin-top:14px">
        <strong>Adicionar cotação</strong>
        <div class="campos" style="margin-top:8px">
          <div class="campo"><label for="ct-forn">Fornecedor</label><select id="ct-forn">${opcoes}</select></div>
          <div class="campo"><label for="ct-preco">Preço unitário (R$)</label><input id="ct-preco" type="number" min="0" step="0.01"></div>
          <div class="campo"><label for="ct-frete">Frete (R$)</label><input id="ct-frete" type="number" min="0" step="0.01" value="0"></div>
          <div class="campo"><label for="ct-prazo">Prazo de entrega (dias)</label><input id="ct-prazo" type="number" min="0" step="1"></div>
          <div class="campo"><label for="ct-pgto">Pagamento</label><input id="ct-pgto" placeholder="Ex.: 28 dias"></div>
          <div class="campo"><label for="ct-obs">Observação</label><input id="ct-obs"></div>
        </div>
        <div class="acoes"><button class="botao" onclick="adicionarCotacao('${m.ID_Material}')">Adicionar cotação</button></div>
      </div>` : ''}
      ${podeEditar && !opcoes ? '<p class="suave pequeno">Todos os fornecedores ativos já cotaram. Cadastre outro na aba Fornecedores.</p>' : ''}
    </div>`;
  }

  function escolherCotacao(idMaterial, idCotacao) {
    estado.cotacaoEscolhida[idMaterial] = idCotacao;
    desenharCompras();
  }

  async function acaoCompras(funcao, args, mensagem) {
    travarBotoes(true);
    try {
      const r = await chamar(funcao, ...args, auth());
      await recarregarCompras(typeof mensagem === 'function' ? mensagem(r) : mensagem);
    } catch (erro) { mostrarErro(erro); travarBotoes(false); }
  }

  function adicionarCotacao(idMaterial) {
    const v = id => document.getElementById(id).value;
    if (!v('ct-preco')) return mostrarMensagem('Informe o preço unitário.', 'erro');
    acaoCompras('registrarCotacao', [idMaterial, {
      ID_Fornecedor: v('ct-forn'), PrecoUnitario: v('ct-preco'), Frete: v('ct-frete'),
      PrazoDias: v('ct-prazo'), Pagamento: v('ct-pgto'), Observacao: v('ct-obs')
    }], 'Cotação adicionada!');
  }

  function removerCotacaoCompra(idCotacao) {
    if (!confirm('Remover esta cotação?')) return;
    acaoCompras('removerCotacao', [idCotacao], 'Cotação removida.');
  }

  function gerarPedidoCompra(idMaterial, idCotacao) {
    if (!confirm('Gerar o pedido com a cotação escolhida?')) return;
    acaoCompras('gerarPedido', [idMaterial, idCotacao],
      r => r.precisaAprovar ? `Pedido ${r.numero} enviado para aprovação do Gestor.` : `Pedido ${r.numero} gerado!`);
  }

  function decidirPedidoCompra(idPedido, aprovar) {
    if (!confirm(aprovar ? 'Aprovar esta compra?' : 'Recusar esta compra? O material volta para cotação.')) return;
    acaoCompras('decidirPedido', [idPedido, aprovar], aprovar ? 'Compra aprovada!' : 'Compra recusada. Material voltou para cotação.');
  }

  async function salvarNotaFiscal(idPedido) {
    const campo = document.getElementById('nf-arq');
    travarBotoes(true);
    try {
      const arquivo = campo.files[0] ? await lerArquivo(campo.files[0]) : null;
      await chamar('anexarNotaFiscal', idPedido, document.getElementById('nf-num').value, arquivo, auth());
      await recarregarCompras('Nota fiscal salva!');
    } catch (erro) { mostrarErro(erro); travarBotoes(false); }
  }

  /* ---------- Pedidos ---------- */
  function comprasPedidos() {
    const pedidos = estado.compras.pedidos.slice().sort((a, b) => String(b.Numero).localeCompare(String(a.Numero)));
    if (!pedidos.length) return '<div class="cartao"><div class="vazio">Nenhum pedido ainda.</div></div>';
    const total = pedidos.filter(p => p.Situacao !== 'Recusado').reduce((s, p) => s + Number(p.Total), 0);
    return `<div class="cartao tabela-rolavel">
      <table class="tabela">
        <thead><tr><th>Pedido</th><th>Material</th><th>Fornecedor</th><th>Total</th><th>Entrega</th><th>Nota fiscal</th><th>Situação</th></tr></thead>
        <tbody>${pedidos.map(p => `<tr>
          <td class="num"><strong>${esc(p.Numero)}</strong><div class="suave pequeno">${dataBR(p.CriadoEm)}</div></td>
          <td>${esc(p.Material)}</td><td>${esc(nomeFornecedor(p.ID_Fornecedor))}</td>
          <td class="num">${dinheiro(p.Total)}</td>
          <td class="num">${dataBR(p.Situacao === 'Entregue' ? p.DataEntrega : p.PrevisaoEntrega)}</td>
          <td>${p.NumeroNF ? esc(p.NumeroNF) + ' ' + linkArquivo(p.ArquivoNF, '') : '<span class="suave">—</span>'}</td>
          <td>${etiqueta(p.Situacao === 'Aprovado' ? 'Pedido feito' : p.Situacao)}</td></tr>`).join('')}</tbody>
        <tfoot><tr><th colspan="3">Total comprado (sem recusados)</th><th class="num">${dinheiro(total)}</th><th colspan="3"></th></tr></tfoot>
      </table>
      <p class="suave pequeno">As notas fiscais anexadas aqui vão alimentar as contas a pagar do Financeiro.</p>
    </div>`;
  }

  /* ---------- Fornecedores (valem para todas as obras) ---------- */
  function comprasFornecedores() {
    const { fornecedores, podeEditar } = estado.compras;
    const f = estado.fornecedorEditado;
    const estrelas = n => '★'.repeat(Number(n) || 0) + '☆'.repeat(5 - (Number(n) || 0));
    const form = podeEditar && f ? `<div class="form-inline">
      <strong>${f.ID_Fornecedor ? 'Editar fornecedor' : 'Novo fornecedor'}</strong>
      <div class="campos" style="margin-top:8px">
        <div class="campo"><label for="fo-nome">Nome</label><input id="fo-nome" value="${esc(f.Nome)}"></div>
        <div class="campo"><label for="fo-cnpj">CNPJ</label><input id="fo-cnpj" value="${esc(f.CNPJ)}"></div>
        <div class="campo"><label for="fo-cat">Categoria</label><input id="fo-cat" value="${esc(f.Categoria)}" placeholder="Ex.: Elétrica"></div>
        <div class="campo"><label for="fo-contato">Contato</label><input id="fo-contato" value="${esc(f.Contato)}"></div>
        <div class="campo"><label for="fo-tel">Telefone</label><input id="fo-tel" value="${esc(f.Telefone)}"></div>
        <div class="campo"><label for="fo-email">E-mail</label><input id="fo-email" value="${esc(f.Email)}"></div>
        <div class="campo"><label for="fo-aval">Avaliação</label><select id="fo-aval">${[0, 1, 2, 3, 4, 5].map(n =>
          `<option value="${n}" ${Number(f.Avaliacao) === n ? 'selected' : ''}>${n ? estrelas(n) : 'Sem avaliação'}</option>`).join('')}</select></div>
        <div class="campo"><label for="fo-ativo">Situação</label><select id="fo-ativo">
          <option value="sim" ${f.Ativo !== false ? 'selected' : ''}>Ativo</option><option value="nao" ${f.Ativo === false ? 'selected' : ''}>Inativo</option></select></div>
      </div>
      <div class="acoes"><button class="botao" onclick="estado.fornecedorEditado=null; desenharCompras()">Cancelar</button>
        <button class="botao primario" onclick="salvarFornecedorCompra()">Salvar fornecedor</button></div>
    </div>` : '';
    return `<div class="cartao tabela-rolavel">
      <div class="cabecalho-obra" style="margin-bottom:8px"><div><h2>Fornecedores</h2>
        <div class="suave pequeno">Cadastro único, usado em todas as obras.</div></div>
        ${podeEditar && !f ? `<button class="botao" onclick="estado.fornecedorEditado={}; desenharCompras()">+ Novo fornecedor</button>` : ''}</div>
      ${form}
      <table class="tabela">
        <thead><tr><th>Fornecedor</th><th>Categoria</th><th>Contato</th><th>Avaliação</th><th></th></tr></thead>
        <tbody>${fornecedores.map((x, i) => `<tr class="${x.Ativo === false ? 'inativo' : ''}">
          <td><strong>${esc(x.Nome)}</strong><div class="suave pequeno">${esc(x.CNPJ)}</div></td>
          <td>${esc(x.Categoria) || '—'}</td>
          <td>${esc(x.Contato)}<div class="suave pequeno">${esc(x.Telefone)} ${esc(x.Email)}</div></td>
          <td class="estrelas">${estrelas(x.Avaliacao)}</td>
          <td>${podeEditar ? `<button class="botao pequeno" onclick="estado.fornecedorEditado=estado.compras.fornecedores[${i}]; desenharCompras()">Editar</button>` : ''}
            ${x.Ativo === false ? '<span class="etiqueta st-inativo">Inativo</span>' : ''}</td></tr>`).join('')}</tbody>
      </table>
    </div>`;
  }

  async function salvarFornecedorCompra() {
    const v = id => document.getElementById(id).value;
    travarBotoes(true);
    try {
      await chamar('salvarFornecedor', {
        ID_Fornecedor: estado.fornecedorEditado.ID_Fornecedor, Nome: v('fo-nome'), CNPJ: v('fo-cnpj'), Categoria: v('fo-cat'),
        Contato: v('fo-contato'), Telefone: v('fo-tel'), Email: v('fo-email'), Avaliacao: v('fo-aval'), Ativo: v('fo-ativo') === 'sim'
      }, auth());
      estado.fornecedorEditado = null;
      await recarregarCompras('Fornecedor salvo!');
    } catch (erro) { mostrarErro(erro); travarBotoes(false); }
  }

  /* =========================================================
   * TELA 10 – Setor Gestor (aba do Gestor na página da obra)
   * Aprovações pendentes da obra + regra de aprovação de compras
   * ========================================================= */
  async function telaGestor(idObra) {
    carregando('Abrindo Gestor…');
    try {
      estado.gestor = await chamar('abrirGestor', idObra, auth());
      desenharGestor();
    } catch (erro) { mostrarErro(erro); irPara('#/obra/' + idObra); }
  }

  async function recarregarGestor() {
    estado.gestor = await chamar('abrirGestor', estado.gestor.obra.ID_Obra, auth());
    desenharGestor();
  }

  // Problemas da obra: abertos primeiro (gravidade e tempo em aberto), com o plano de ação
  function problemasGestor() {
    const { problemas, podeDecidir, podeResolver } = estado.gestor;
    const abertos = problemas.filter(p => p.Situacao !== 'Resolvido');
    const resolvidos = problemas.filter(p => p.Situacao === 'Resolvido');
    const conta = g => abertos.filter(p => p.Gravidade === g).length;
    const vencidos = abertos.filter(p => p.PrazoVencido).length;
    const semPlano = abertos.filter(p => !p.Acao).length;
    return `<div class="cartao secao">
      <h2>Problemas da obra (${abertos.length} aberto(s))</h2>
      ${abertos.length ? `<div class="indicadores">
        <div class="indicador ${conta('Alta') ? 'ruim' : ''}"><span>Gravidade alta</span><strong>${conta('Alta')}</strong></div>
        <div class="indicador"><span>Média / baixa</span><strong>${conta('Média')} / ${conta('Baixa')}</strong></div>
        <div class="indicador ${semPlano ? 'ruim' : ''}"><span>Sem plano de ação</span><strong>${semPlano}</strong></div>
        <div class="indicador ${vencidos ? 'ruim' : ''}"><span>Prazo vencido</span><strong>${vencidos}</strong></div>
      </div>
      ${abertos.map(p => cartaoProblema(p, { podeDefinir: podeDecidir, podeResolver })).join('')}`
      : '<p class="suave">Nenhum problema aberto nesta obra.</p>'}
      ${resolvidos.length ? `<details><summary>Resolvidos (${resolvidos.length})</summary>${resolvidos.map(p => cartaoProblema(p)).join('')}</details>` : ''}
    </div>`;
  }

  function desenharGestor() {
    const { obra, regra, regraAlterada, pedidos, aditivos, outras, podeDecidir, fisico } = estado.gestor;
    estado.setorAberto = 'gestor';
    const descricao = !regra.exigir ? 'Hoje nenhuma compra precisa de aprovação do Gestor.'
      : Number(regra.valor) === 0 ? 'Hoje todas as compras precisam de aprovação do Gestor.'
      : `Hoje compras acima de ${dinheiro(regra.valor)} precisam de aprovação do Gestor.`;
    const botoes = (funcao, id) => podeDecidir ? `<div class="acoes-linha">
        <button class="botao pequeno" onclick="decidirNoGestor('${funcao}', '${id}', false)">Recusar</button>
        <button class="botao pequeno sucesso" onclick="decidirNoGestor('${funcao}', '${id}', true)">Aprovar</button></div>` : '';

    const linhasPedidos = pedidos.map(p => `<tr>
      <td><strong>${esc(p.Material)}</strong><div class="suave pequeno">${esc(p.Numero)} · ${Number(p.Quantidade).toLocaleString('pt-BR')} ${esc(p.Unidade)} · ${esc(p.Fornecedor)}</div></td>
      <td class="num"><strong>${dinheiro(p.Total)}</strong></td>
      <td class="num">${dataBR(p.DataNecessaria)}</td>
      <td class="num ${p.DiasAguardando >= 3 ? 'texto-erro' : ''}">${p.DiasAguardando} dia(s)</td>
      <td>${botoes('decidirPedido', p.ID_Pedido)}</td></tr>`).join('');
    const linhasAditivos = aditivos.map(a => `<tr>
      <td><strong>Aditivo ${esc(a.Numero)}</strong><div class="suave pequeno">${esc(a.Descricao)}</div> ${linkArquivo(a.Arquivo, 'Arquivo')}</td>
      <td class="num"><strong>${dinheiro(a.Valor)}</strong></td>
      <td class="num">${dataBR(a.Data)}</td>
      <td class="num ${a.DiasAguardando >= 3 ? 'texto-erro' : ''}">${a.DiasAguardando} dia(s)</td>
      <td>${botoes('decidirAditivo', a.ID_Aditivo)}</td></tr>`).join('');

    tela(`
      <a class="link-voltar" onclick="irPara('#/obra/${obra.ID_Obra}')">← Voltar para a obra ${esc(obra.Codigo)}</a>
      <div class="cabecalho-obra">
        <div>
          <div class="codigo">${esc(obra.Codigo)} · GESTOR</div>
          <h1>${esc(obra.Cliente)}</h1>
          <div class="etiquetas">${etiqueta(obra.Status)}${obra.Atrasada ? etiqueta('Atrasada') : ''}</div>
        </div>
        ${fisico.temMedicao ? `<div class="cartao resumo-andamento">
          <div class="suave">Andamento físico</div>
          <div class="numero">${fisico.validado}%</div>
          ${barraPercentual(fisico.validado, fisico.esperado !== '' && fisico.validado + 5 < fisico.esperado ? 'atrasado' : '')}
          <div class="suave pequeno" style="margin-top:8px">${fisico.esperado !== '' ? 'Previsto hoje: ' + fisico.esperado + '%' : ''}</div>
        </div>` : ''}
      </div>
      ${!podeDecidir ? `<div class="aviso info">Você está vendo a aba do Gestor apenas para consulta.</div>` : ''}

      ${problemasGestor()}

      <div class="cartao secao tabela-rolavel">
        <h2>Compras aguardando aprovação (${pedidos.length})</h2>
        ${pedidos.length ? `<table class="tabela"><thead><tr><th>Compra</th><th>Total</th><th>Precisa chegar</th><th>Esperando</th><th></th></tr></thead>
          <tbody>${linhasPedidos}</tbody></table>` : '<p class="suave">Nenhuma compra desta obra esperando aprovação.</p>'}
      </div>

      <div class="cartao secao tabela-rolavel">
        <h2>Aditivos aguardando aprovação (${aditivos.length})</h2>
        ${aditivos.length ? `<table class="tabela"><thead><tr><th>Aditivo</th><th>Valor</th><th>Pedido em</th><th>Esperando</th><th></th></tr></thead>
          <tbody>${linhasAditivos}</tbody></table>` : '<p class="suave">Nenhum aditivo desta obra esperando aprovação.</p>'}
      </div>

      <div class="cartao secao">
        <h2>Regra de aprovação de compras</h2>
        <p>${descricao} <span class="suave">A regra vale para todas as obras.</span></p>
        ${podeDecidir ? `<div class="regra-aprovacao">
          <label class="opcao" style="margin:0"><input type="checkbox" id="rg-exigir" ${regra.exigir ? 'checked' : ''} onchange="atualizarRegraTela()">
            Compras precisam da aprovação do Gestor</label>
          <div class="campo" id="rg-campo-valor"><label for="rg-valor">Quando o pedido passar de (R$)</label>
            <input id="rg-valor" type="number" min="0" step="100" value="${esc(regra.valor)}"></div>
          <button class="botao primario" onclick="salvarRegra()">Salvar regra</button>
        </div>
        <p class="suave pequeno">Use 0 para aprovar todas as compras. A regra vale para os próximos pedidos; os que já estão esperando continuam aqui.</p>` : ''}
        ${regraAlterada ? `<p class="suave pequeno">Última alteração: ${esc(regraAlterada.AlteradoPor)} em ${dataBR(regraAlterada.AlteradoEm)}.</p>` : ''}
      </div>

      ${outras.length ? `<div class="cartao secao">
        <h2>Outras obras com aprovações pendentes</h2>
        <ul class="lista-simples">${outras.map(o => `<li><a class="link-tabela" onclick="irPara('#/obra/${o.ID_Obra}/gestor')">${esc(o.Codigo)}</a>
          · ${esc(o.Cliente)} · ${o.Quantidade} pendente(s)</li>`).join('')}</ul>
      </div>` : ''}
    `);
    if (podeDecidir) atualizarRegraTela();
  }

  function atualizarRegraTela() {
    document.getElementById('rg-campo-valor').style.opacity = document.getElementById('rg-exigir').checked ? 1 : .4;
    document.getElementById('rg-valor').disabled = !document.getElementById('rg-exigir').checked;
  }

  async function salvarRegra() {
    const exigir = document.getElementById('rg-exigir').checked;
    const valor = document.getElementById('rg-valor').value;
    if (exigir && valor === '') return mostrarMensagem('Informe o valor.', 'erro');
    travarBotoes(true);
    try {
      const regra = await chamar('salvarRegraAprovacao', { exigir, valor }, auth());
      estado.gestor = await chamar('abrirGestor', estado.gestor.obra.ID_Obra, auth());
      desenharGestor();
      mostrarMensagem(!regra.exigir ? 'Salvo: compras não precisam mais de aprovação.'
        : 'Salvo: compras acima de ' + dinheiro(regra.valor) + ' vão para aprovação do Gestor.');
    } catch (erro) { mostrarErro(erro); travarBotoes(false); }
  }

  async function decidirNoGestor(funcao, id, aprovar) {
    if (!confirm(aprovar ? 'Aprovar?' : 'Recusar?')) return;
    travarBotoes(true);
    try {
      await chamar(funcao, id, aprovar, auth());
      await recarregarGestor();
      mostrarMensagem(aprovar ? 'Aprovado!' : 'Recusado.');
    } catch (erro) { mostrarErro(erro); travarBotoes(false); }
  }

  /* =========================================================
   * TELA 11 – Setor Expedição
   * Itens para programar, agenda de entregas (com romaneio)
   * e confirmação na obra
   * ========================================================= */
  async function telaExpedicao(idObra) {
    carregando('Abrindo Expedição…');
    try {
      estado.exp = await chamar('abrirExpedicao', idObra, auth());
      estado.expSelecionados = [];
      estado.expProgramando = false;
      estado.expConfirmando = null;
      desenharExpedicao();
    } catch (erro) { mostrarErro(erro); irPara('#/obra/' + idObra); }
  }

  async function recarregarExpedicao(mensagem) {
    if (mensagem) mostrarMensagem(mensagem);
    estado.exp = await chamar('abrirExpedicao', estado.exp.obra.ID_Obra, auth());
    estado.expSelecionados = [];
    estado.expProgramando = false;
    estado.expConfirmando = null;
    desenharExpedicao();
  }

  function entregaAtiva(e) { return estado.exp.passos.includes(e.Situacao); }

  function diaSemana(iso) {
    return ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'][new Date(iso + 'T12:00:00').getDay()];
  }

  function desenharExpedicao() {
    const { obra, aProgramar, entregas, podeEditar, podeConfirmar } = estado.exp;
    const validas = entregas.filter(e => e.Situacao !== 'Cancelada');
    const ativas = validas.filter(entregaAtiva);
    const feitas = validas.filter(e => !entregaAtiva(e));

    tela(`
      <a class="link-voltar" onclick="irPara('#/obra/${obra.ID_Obra}')">← Voltar para a obra ${esc(obra.Codigo)}</a>
      <div class="cabecalho-obra">
        <div>
          <div class="codigo">${esc(obra.Codigo)} · EXPEDIÇÃO</div>
          <h1>${esc(obra.Cliente)}</h1>
          <div class="suave">Entrega em: ${esc(obra.Endereco) || '—'}</div>
        </div>
        <div class="cartao resumo-andamento">
          <div class="suave">Entregas concluídas</div>
          <div class="numero">${feitas.length} de ${validas.length}</div>
          <div class="suave pequeno">${aProgramar.length} iten(s) a programar</div>
        </div>
      </div>
      ${!podeEditar && !podeConfirmar ? `<div class="aviso info">Você está vendo a Expedição apenas para consulta.</div>` : ''}
      ${!podeEditar && podeConfirmar ? `<div class="aviso info">Você pode confirmar o recebimento das entregas na obra.</div>` : ''}

      ${expItensParaProgramar()}

      <h2 style="margin-top:8px">Agenda de entregas</h2>
      ${ativas.length ? ativas.map(cartaoEntrega).join('') : '<div class="cartao secao"><p class="suave">Nenhuma entrega programada.</p></div>'}

      ${feitas.length ? `<div class="cartao secao tabela-rolavel">
        <h2>Entregas concluídas</h2>
        <table class="tabela"><thead><tr><th>Entrega</th><th>Data</th><th>Itens</th><th>Situação</th><th>Confirmação</th></tr></thead>
        <tbody>${feitas.slice().reverse().map(e => `<tr>
          <td class="num"><strong>${esc(e.Numero)}</strong><div class="suave pequeno">${esc(e.Transporte)}</div></td>
          <td class="num">${dataBR(e.Data)}</td>
          <td>${e.itens.map(i => `${i.Recebido === false ? '<s>' : ''}${esc(i.Material)}${i.Recebido === false ? '</s>' : ''}`).join(', ')}</td>
          <td>${etiqueta(e.Situacao)}${e.Divergencia ? `<div class="pequeno texto-erro">${esc(e.Divergencia)}</div>` : ''}</td>
          <td class="pequeno">${e.ConfirmadoPor ? esc(e.ConfirmadoPor) + '<br>' + dataBR(e.ConfirmadoEm) : '—'} ${linkArquivo(e.FotoConfirmacao, 'Foto')}</td>
        </tr>`).join('')}</tbody></table>
      </div>` : ''}
    `);
  }

  /* ---------- Itens comprados que ainda não têm entrega ---------- */
  function expItensParaProgramar() {
    const { aProgramar, podeEditar, hoje, transportes, periodos } = estado.exp;
    if (!aProgramar.length) return `<div class="cartao secao"><h2>Itens para programar</h2>
      <p class="suave">Nenhum item esperando entrega. Os pedidos feitos em Compras aparecem aqui.</p></div>`;
    const sel = estado.expSelecionados;
    const linhas = aProgramar.map(p => {
      const urgente = p.DataNecessaria && p.DataNecessaria <= somarDias(hoje, 7);
      return `<tr>
        ${podeEditar ? `<td><input type="checkbox" ${sel.includes(p.ID_Pedido) ? 'checked' : ''} onchange="marcarItemEntrega('${p.ID_Pedido}', this.checked)"></td>` : ''}
        <td><strong>${esc(p.Material)}</strong><div class="suave pequeno">${esc(p.NumeroPedido)} · ${esc(p.Fornecedor)}</div></td>
        <td class="num">${Number(p.Quantidade).toLocaleString('pt-BR')} ${esc(p.Unidade)}</td>
        <td>${esc(p.Etapa)}</td>
        <td class="num">${dataBR(p.PrevisaoEntrega)}</td>
        <td class="num ${urgente ? 'texto-erro' : ''}">${dataBR(p.DataNecessaria)}</td>
      </tr>`;
    }).join('');
    const form = estado.expProgramando ? `<div class="form-inline">
      <strong>Nova entrega com ${sel.length} iten(s)</strong>
      <div class="campos" style="margin-top:8px">
        <div class="campo"><label for="en-data">Data</label><input id="en-data" type="date" value="${somarDias(hoje, 1)}"></div>
        <div class="campo"><label for="en-periodo">Período</label><select id="en-periodo">${periodos.map(x => `<option>${x}</option>`).join('')}</select></div>
        <div class="campo"><label for="en-transp">Transporte</label><select id="en-transp" onchange="ajustarCamposTransporte()">${transportes.map(x => `<option>${x}</option>`).join('')}</select></div>
        <div class="campo so-frota"><label for="en-veiculo">Veículo</label><input id="en-veiculo" placeholder="Ex.: Caminhão VW (ABC-1D23)"></div>
        <div class="campo so-frota"><label for="en-motorista">Motorista</label><input id="en-motorista"></div>
        <div class="campo so-transportadora" hidden><label for="en-transportadora">Transportadora</label><input id="en-transportadora"></div>
        <div class="campo largo"><label for="en-obs">Observações</label><input id="en-obs" placeholder="Ex.: descarregar na garagem"></div>
      </div>
