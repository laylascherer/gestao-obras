<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestão de Obras</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
  :root {
    --fundo: #f4f6f9;
    --cartao: #ffffff;
    --borda: #dfe3ea;
    --texto: #1d2433;
    --texto-suave: #5f6b7e;
    --primaria: #1f5fbf;
    --primaria-clara: #e7effb;
    --cinza: #8a94a6;
    --cinza-claro: #eef0f4;
    --verde: #1e8a4c;
    --verde-claro: #e3f4ea;
    --amarelo: #b7791f;
    --amarelo-claro: #fdf3e0;
    --vermelho: #c53030;
    --vermelho-claro: #fde8e8;
    --sombra: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
    --raio: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 15px;
    color: var(--texto);
    background: var(--fundo);
  }

  button, input, select, textarea { font: inherit; color: inherit; }

  /* ---------- Topo ---------- */
  .topo {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 16px;
    padding: 12px 24px;
    background: #14233c; color: #fff;
  }
  .topo .marca { font-weight: 700; font-size: 17px; cursor: pointer; }
  .topo .marca span { color: #8fb4ff; }
  .topo .espaco { flex: 1; }
  .topo .selo { background: #f6c453; color: #3d2a00; font-weight: 600; padding: 2px 8px; border-radius: 999px; font-size: 11px; }
  .area-usuario { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 13px; }
  .botao-topo {
    background: transparent; color: #fff; border: 1px solid #3a5280; border-radius: 6px;
    padding: 6px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  }
  .botao-topo:hover { background: #22365a; }
  .contador { background: #f6c453; color: #3d2a00; border-radius: 999px; padding: 0 7px; font-weight: 700; font-size: 12px; }
  .simular { display: inline-flex; align-items: center; gap: 6px; }
  .simular select { background: #22365a; color: #fff; border: 1px solid #3a5280; border-radius: 6px; padding: 5px 6px; max-width: 220px; }
  .simulando { background: #f6c453; color: #3d2a00; font-weight: 600; padding: 3px 9px; border-radius: 999px; font-size: 12px; }
  .nome-usuario { font-weight: 600; }

  main { max-width: 1180px; margin: 0 auto; padding: 24px; }

  h1 { font-size: 24px; margin: 0 0 4px; }
  h2 { font-size: 18px; margin: 0 0 12px; }
  h3 { font-size: 16px; margin: 0; }

  /* Campo de arquivo: mesmo estilo dos botões e nunca mais largo que o espaço disponível */
  input[type=file] { max-width: 100%; min-width: 0; font-size: 13px; color: var(--texto-suave); }
  input[type=file]::file-selector-button {
    font: inherit; font-weight: 500; color: var(--texto); background: var(--cartao);
    border: 1px solid var(--borda); border-radius: 8px; padding: 7px 12px; margin-right: 10px; cursor: pointer;
  }
  input[type=file]::file-selector-button:hover { background: var(--cinza-claro); }
  .suave { color: var(--texto-suave); }

  /* ---------- Botões ---------- */
  .botao {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--borda); background: var(--cartao);
    padding: 9px 16px; border-radius: 8px; cursor: pointer; font-weight: 500;
  }
  .botao:hover { background: var(--cinza-claro); }
  .botao.primario { background: var(--primaria); border-color: var(--primaria); color: #fff; }
  .botao.primario:hover { filter: brightness(1.08); }
  .botao.sucesso { background: var(--verde); border-color: var(--verde); color: #fff; }
  .botao:disabled { opacity: .55; cursor: not-allowed; }
  .link-voltar {
    display: inline-block; margin-bottom: 16px; color: var(--primaria);
    text-decoration: none; font-weight: 500; cursor: pointer;
  }

  /* ---------- Barra de busca e filtros ---------- */
  .barra { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 20px 0; }
  .busca {
    flex: 1; min-width: 220px;
    padding: 10px 14px; border: 1px solid var(--borda); border-radius: 8px; background: var(--cartao);
  }
  .filtros { display: flex; flex-wrap: wrap; gap: 6px; }
  .filtro {
    border: 1px solid var(--borda); background: var(--cartao);
    padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 13px;
  }
  .filtro.ativo { background: var(--primaria); border-color: var(--primaria); color: #fff; }

  /* ---------- Cartões das obras (Home) ---------- */
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .cartao {
    background: var(--cartao); border: 1px solid var(--borda);
    border-radius: var(--raio); box-shadow: var(--sombra); padding: 18px;
  }
  .cartao-obra { cursor: pointer; transition: transform .12s, box-shadow .12s; }
  .cartao-obra:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(16, 24, 40, .1); }
  .cartao-obra .linha1 { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .codigo { font-weight: 700; color: var(--primaria); font-size: 13px; letter-spacing: .3px; }
  .cliente { font-weight: 600; font-size: 16px; margin-bottom: 4px; }
  .endereco { font-size: 13px; color: var(--texto-suave); margin-bottom: 14px; }
  .rodape-cartao { display: flex; justify-content: space-between; font-size: 13px; color: var(--texto-suave); margin-top: 8px; }

  .progresso { height: 8px; background: var(--cinza-claro); border-radius: 999px; overflow: hidden; }
  .progresso > div { height: 100%; background: var(--primaria); border-radius: 999px; }

  /* ---------- Etiquetas de status ---------- */
  .etiqueta {
    display: inline-block; padding: 3px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600; white-space: nowrap;
  }
  .st-a-iniciar, .st-nao-iniciado { background: var(--cinza-claro); color: #4a5568; }
  .st-em-andamento, .st-em-preenchimento { background: var(--primaria-clara); color: var(--primaria); }
  .st-aguardando-retomada, .st-aguardando { background: var(--amarelo-claro); color: var(--amarelo); }
  .st-concluida, .st-concluido, .st-enviado-para-contrato { background: var(--verde-claro); color: var(--verde); }
  .st-atrasada { background: var(--vermelho-claro); color: var(--vermelho); }

  /* ---------- Página da obra ---------- */
  .cabecalho-obra { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; align-items: flex-start; margin-bottom: 20px; }
  .cabecalho-obra .etiquetas { display: flex; gap: 6px; margin-top: 8px; }
  .resumo-andamento { min-width: 220px; }
  .resumo-andamento .numero { font-size: 28px; font-weight: 700; }

  .campos { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px 20px; }
  .campo label { display: block; font-size: 12px; font-weight: 600; color: var(--texto-suave); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .3px; }
  .campo .valor { padding: 9px 0; }
  .campo[hidden] { display: none; }
  .resumo-parcelas { background: var(--primaria-clara); color: var(--texto); border-radius: 8px; padding: 10px 12px; }
  .campo input, .campo select, .campo textarea {
    width: 100%; padding: 9px 12px; border: 1px solid var(--borda); border-radius: 8px; background: #fff;
  }
  .campo input:focus, .campo select:focus, .campo textarea:focus { outline: 2px solid var(--primaria-clara); border-color: var(--primaria); }
  .campo.largo { grid-column: 1 / -1; }
  .campo textarea { min-height: 80px; resize: vertical; }
  .acoes { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }

  .setores { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; margin-top: 12px; }
  .box-setor {
    position: relative; padding: 16px; border-radius: var(--raio);
    border: 1px solid var(--borda); background: var(--cartao); box-shadow: var(--sombra);
    min-height: 120px; display: flex; flex-direction: column; gap: 8px;
  }
  .box-setor.liberado { border-top: 4px solid var(--primaria); cursor: pointer; }
  .box-setor.liberado:hover { box-shadow: 0 6px 16px rgba(16, 24, 40, .1); }
  .box-setor.bloqueado { background: #f0f1f4; color: var(--cinza); box-shadow: none; border-top: 4px solid #cfd4dc; cursor: not-allowed; }
  .box-setor .ordem { font-size: 12px; color: var(--texto-suave); font-weight: 600; }
  .box-setor .nome { font-weight: 700; font-size: 15px; }
  .box-setor .detalhe { font-size: 12px; color: var(--texto-suave); margin-top: auto; }
  .box-setor .cadeado { position: absolute; top: 14px; right: 14px; }
  .box-setor.bloqueado .detalhe { color: var(--cinza); }

  /* ---------- Checklist de documentos ---------- */
  .checklist { list-style: none; padding: 0; margin: 0; }
  .checklist li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--cinza-claro); }
  .checklist li:last-child { border-bottom: none; }
  .checklist input { width: 18px; height: 18px; }
  .checklist .obrig { font-size: 11px; color: var(--vermelho); font-weight: 600; }
  .checklist li { flex-wrap: wrap; }
  .checklist .anexo { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .ver-arquivo { display: inline-flex; align-items: center; gap: 4px; color: var(--primaria); font-weight: 500; text-decoration: none; }
  .ver-arquivo:hover { text-decoration: underline; }
  .botao.pequeno { padding: 5px 12px; font-size: 13px; }
  .botao.perigo { color: var(--vermelho); }

  .secao { margin-bottom: 20px; }
  .aviso {
    padding: 12px 16px; border-radius: 8px; margin-bottom: 16px;
    background: var(--amarelo-claro); color: #744210; font-size: 14px;
  }
  .aviso.info { background: var(--primaria-clara); color: #1a4489; }
  .aviso.ok { background: var(--verde-claro); color: #1c5e37; }

  /* ---------- Carregando e mensagens ---------- */
  .carregando { text-align: center; padding: 60px; color: var(--texto-suave); }
  .girando {
    width: 32px; height: 32px; margin: 0 auto 12px; border-radius: 50%;
    border: 3px solid var(--cinza-claro); border-top-color: var(--primaria);
    animation: girar .8s linear infinite;
  }
  @keyframes girar { to { transform: rotate(360deg); } }

  .mensagem {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #14233c; color: #fff; padding: 12px 20px; border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .2); z-index: 50; max-width: 90vw;
  }
  .mensagem.erro { background: var(--vermelho); }

  .vazio { text-align: center; padding: 48px; color: var(--texto-suave); }

  /* ---------- Login ---------- */
  .tela-login { max-width: 420px; margin: 40px auto; display: grid; gap: 14px; }
  .tela-login form { display: grid; gap: 14px; }
  .tela-login .link-voltar { background: none; border: 0; padding: 0; margin: 0; text-align: left; }
  .botao.largo { width: 100%; justify-content: center; }
  .campo-senha { position: relative; }
  .campo-senha input { padding-right: 44px; }
  .ver-senha { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); background: none; border: 0;
    padding: 6px 8px; cursor: pointer; color: var(--texto-suave); display: grid; place-items: center; border-radius: 6px; }
  .ver-senha:hover { color: var(--texto); background: var(--cinza-claro); }
  .separador { display: flex; align-items: center; gap: 10px; color: var(--texto-suave); font-size: 13px; }
  .separador::before, .separador::after { content: ''; flex: 1; height: 1px; background: var(--borda); }
  .pequeno { font-size: 13px; }

  /* ---------- Usuários ---------- */
  .tabela-rolavel { overflow-x: auto; }
  .tabela { width: 100%; border-collapse: collapse; font-size: 14px; }
  .tabela th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .3px; color: var(--texto-suave); padding: 8px 10px; border-bottom: 1px solid var(--borda); white-space: nowrap; }
  .tabela td { padding: 10px; border-bottom: 1px solid var(--cinza-claro); vertical-align: middle; }
  .tabela tr:last-child td { border-bottom: 0; }
  .linha-clicavel { cursor: pointer; }
  .linha-clicavel:hover td { background: var(--fundo); }
  .centro { text-align: center !important; }
  .matriz input { width: 18px; height: 18px; }
  .matriz td:first-child { font-weight: 500; }
  .opcao { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; cursor: pointer; }
  .st-ativo { background: var(--verde-claro); color: var(--verde); }
  .st-pendente { background: var(--amarelo-claro); color: var(--amarelo); }
  .st-recusado, .st-inativo { background: var(--cinza-claro); color: #4a5568; }


  /* ---------- Telas de setor (Contrato e próximas) ---------- */
  .passos { display: flex; align-items: center; overflow-x: auto; padding: 2px 0; }
  .passo { display: flex; align-items: center; gap: 8px; white-space: nowrap; font-weight: 500; color: var(--texto-suave); }
  .passo .bola { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700;
    border: 2px solid var(--borda); background: var(--cartao); }
  .passo.feito { color: var(--texto); }
  .passo.feito .bola { background: var(--verde); border-color: var(--verde); color: #fff; }
  .passo.atual { color: var(--texto); font-weight: 700; }
  .passo.atual .bola { border-color: var(--primaria); color: var(--primaria); }
  .linha-passo { flex: 1; min-width: 28px; height: 2px; background: var(--borda); margin: 0 12px; }
  .linha-passo.feito { background: var(--verde); }
  .duas-colunas { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  .subtitulo { font-size: 15px; margin: 20px 0 4px; }
  .arquivo-linha { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px;
    padding: 12px 0; border-bottom: 1px solid var(--cinza-claro); }
  .arquivo-linha:last-of-type { border-bottom: 0; }
  .arquivo-linha .anexo { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .destaque-acao { border: 2px solid var(--verde); }
  .form-inline { padding: 14px; border: 1px solid var(--borda); border-radius: 8px; margin-bottom: 14px; background: var(--fundo); }
  .acoes-linha { display: flex; gap: 6px; margin-top: 6px; }
  .rotulo-pequeno { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; color: var(--texto-suave); }
  .lista-dados { display: grid; gap: 12px; margin: 0; }
  .lista-dados dt { font-size: 12px; font-weight: 600; color: var(--texto-suave); text-transform: uppercase; letter-spacing: .3px; }
  .lista-dados dd { margin: 2px 0 0; }
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .st-em-elaboracao { background: var(--primaria-clara); color: var(--primaria); }
  .st-aguardando-assinatura, .st-aguardando-gestor { background: var(--amarelo-claro); color: var(--amarelo); }
  .st-assinado, .st-aprovado { background: var(--verde-claro); color: var(--verde); }
  .st-recusado { background: var(--vermelho-claro); color: var(--vermelho); }

  /* ---------- Engenharia ---------- */
  .abas-internas { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 2px solid var(--borda); margin: 8px 0 16px; }
  .aba-interna { background: none; border: 0; padding: 10px 14px; cursor: pointer; font-weight: 500; color: var(--texto-suave);
    border-bottom: 3px solid transparent; margin-bottom: -2px; }
  .aba-interna:hover { color: var(--texto); }
  .aba-interna.ativa { color: var(--primaria); border-bottom-color: var(--primaria); font-weight: 600; }
  .checklist-pronto { list-style: none; padding: 0; margin: 4px 0; display: grid; gap: 6px; color: var(--texto-suave); }
  .checklist-pronto li.ok { color: var(--verde); font-weight: 500; }
  .grade-cartoes { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .envio-versao { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--cinza-claro); }
  .envio-versao > * { min-width: 0; width: 100%; }
  .envio-versao input:not([type=file]) { padding: 7px 10px; border: 1px solid var(--borda); border-radius: 8px; }
  .envio-versao .botao { justify-content: center; }
  .grade-cartoes > .cartao { min-width: 0; display: flex; flex-direction: column; }
  .grade-cartoes .cabecalho-obra { align-items: center; flex-wrap: nowrap; }
  .lista-simples { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px; }
  .arquivo-pequeno { font-size: 12px; max-width: 200px; }
  .tabela input, .tabela select { padding: 6px 8px; border: 1px solid var(--borda); border-radius: 6px; background: #fff; width: 100%; min-width: 0; }
  .tabela .input-curto { width: 80px; }
  .tabela-materiais td:first-child { min-width: 220px; }
  .coluna-gantt { min-width: 200px; width: 35%; }
  .gantt { position: relative; height: 14px; background: var(--cinza-claro); border-radius: 999px; }
  .gantt-barra { position: absolute; top: 0; bottom: 0; background: var(--primaria); border-radius: 999px; }
  .texto-erro { color: var(--vermelho); font-weight: 600; }
  .lista-fotos { display: grid; gap: 6px; margin-bottom: 4px; }
  .foto-link { color: var(--primaria); text-decoration: none; font-size: 14px; display: inline-flex; align-items: center; gap: 4px; }
  tfoot th { text-align: left; padding: 10px; border-top: 2px solid var(--borda); }
  details summary { cursor: pointer; color: var(--primaria); margin-top: 6px; }
  .st-liberado-para-compras, .st-solicitado { background: var(--verde-claro); color: var(--verde); }
  .st-rascunho { background: var(--cinza-claro); color: #4a5568; }
  .st-em-cotacao, .st-comprado { background: var(--primaria-clara); color: var(--primaria); }

  /* ---------- Compras ---------- */
  .funil { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
  .etapa-funil { border: 1px solid var(--borda); border-radius: 10px; padding: 12px; background: var(--cartao); cursor: pointer;
    text-align: left; display: grid; gap: 2px; box-shadow: var(--sombra); }
  .etapa-funil .qtd { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .etapa-funil.ativa { border-color: var(--primaria); background: var(--primaria-clara); }
  .aviso.erro { background: var(--vermelho-claro); color: var(--vermelho); }
  .linha-aberta td { background: var(--primaria-clara); }
  .linha-detalhe > td { background: var(--fundo); padding: 14px; }
  .painel-material { display: grid; gap: 12px; }
  .mapa { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .proposta { border: 2px solid var(--borda); border-radius: 10px; padding: 14px; display: grid; gap: 6px; cursor: pointer; background: var(--cartao); align-content: start; }
  .proposta.escolhida { border-color: var(--primaria); background: var(--primaria-clara); }
  .proposta .selos { display: flex; flex-wrap: wrap; gap: 4px; min-height: 22px; }
  .total-proposta { font-size: 22px; font-weight: 700; }
  .det-proposta { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 13px; margin: 0; }
  .det-proposta dt { color: var(--texto-suave); }
  .det-proposta dd { margin: 0; text-align: right; }
  tr.inativo td { opacity: .55; }
  .estrelas { color: #d69e2e; letter-spacing: 1px; white-space: nowrap; }
  .st-aguardando-aprovacao { background: var(--amarelo-claro); color: var(--amarelo); }
  .st-pedido-feito { background: var(--primaria-clara); color: var(--primaria); }
  .st-entregue { background: var(--verde-claro); color: var(--verde); }

  /* ---------- Expedição ---------- */
  .cartao-entrega { border-left: 4px solid var(--primaria); }
  .cartao-entrega h3 { text-transform: capitalize; }
  .lista-itens-entrega { list-style: none; padding: 0; margin: 12px 0; display: grid; gap: 6px; }
  .lista-itens-entrega li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 0; border-bottom: 1px solid var(--cinza-claro); }
  .lista-itens-entrega li:last-child { border-bottom: 0; }
  .lista-itens-entrega input { width: 18px; height: 18px; }
  .st-programada, .st-em-separacao { background: var(--primaria-clara); color: var(--primaria); }
  .st-saiu-para-entrega { background: var(--amarelo-claro); color: var(--amarelo); }
  .st-entregue-com-divergencia { background: var(--vermelho-claro); color: var(--vermelho); }
  .st-cancelada { background: var(--cinza-claro); color: #4a5568; }

  /* ---------- Painel do Gestor ---------- */
  .regra-aprovacao { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px; margin: 12px 0; }
  .regra-aprovacao .campo { min-width: 200px; }
  .link-tabela { color: var(--primaria); font-weight: 600; cursor: pointer; text-decoration: none; }

  @media (max-width: 900px) { .duas-colunas { grid-template-columns: minmax(0, 1fr); } .funil { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); } }

  @media (max-width: 640px) {
    .topo { flex-wrap: wrap; padding: 12px 16px; }
    .area-usuario { width: 100%; }
    main { padding: 16px; }
    h1 { font-size: 20px; }
  }
</style>

</head>
<body>
  <header class="topo">
    <div class="marca" onclick="irPara('#/')">Gestão de <span>Obras</span></div>
    <div class="espaco"></div>
    <span class="selo">PROTÓTIPO</span>
    <div class="area-usuario" id="area-usuario"></div>
  </header>

  <main id="tela">
    <div class="carregando"><div class="girando"></div>Carregando…</div>
  </main>

  <script>window.API_URL = 'https://script.google.com/macros/s/AKfycbywJg49Ftbqzh5b9lH7WorZaftSXjl5nx6Vg38_lAw1dSc_HM8teo8znG44CSKW2KgQ/exec';</script>
<script>
  /* =========================================================
   * Estado do site
   * ========================================================= */
  const estado = {
    auth: { token: '', verComo: '' }, // sessão enviada ao servidor em toda chamada
    sessao: null,       // quem entrou no sistema
    usuario: null,      // quem está usando agora (o próprio ou o simulado pelo administrador)
    simulaveis: [],     // usuários que o administrador pode simular
    pendentes: 0,       // pedidos de acesso esperando aprovação
    admin: null,        // dados da tela de Usuários
    filtroUsuarios: '',
    loginEmail: '',
    obras: [],
    busca: '',
    filtro: 'Todas',
    obraAberta: null    // dados da obra aberta (página da obra / Comercial)
  };

  const STATUS = ['A iniciar', 'Em andamento', 'Aguardando retomada', 'Concluída'];

  /* =========================================================
   * Ajudantes
   * ========================================================= */

  // Chama uma função do Codigo.gs e devolve uma Promise
  // Funciona nos dois lugares: dentro do Google (google.script.run) e no site
  // hospedado no GitHub, que conversa com o servidor pelo endereço API_URL.
  function chamar(funcao, ...args) {
    const falhou = erro => {
      if (String(erro && erro.message).includes('sessão expirou')) { encerrarSessaoLocal(); telaEntrar(); }
      throw erro;
    };
    if (window.API_URL) {
      const controle = new AbortController();
      const limite = setTimeout(() => controle.abort(), 45000);
      return fetch(window.API_URL, {
        method: 'POST',
        signal: controle.signal,
        // text/plain evita a checagem extra do navegador (CORS) que o Google não aceita
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ fn: funcao, args })
      })
        .catch(e => {
          throw new Error(e.name === 'AbortError'
            ? 'O servidor demorou demais para responder. Tente de novo em alguns segundos.'
            : 'Sem conexão com o servidor. Verifique a internet e tente de novo.');
        })
        .then(r => r.json())
        .finally(() => clearTimeout(limite))
        .then(d => { if (!d.ok) throw new Error(d.erro); return d.r; })
        .catch(falhou);
    }
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        [funcao](...args);
    }).catch(falhou);
  }

  // Evita que um texto digitado vire HTML
  function esc(texto) {
    return String(texto ?? '').replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // "Em andamento" -> "st-em-andamento" (classe de cor)
  function classeStatus(texto) {
    return 'st-' + String(texto).toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, '-');
  }

  function etiqueta(texto) {
    return `<span class="etiqueta ${classeStatus(texto)}">${esc(texto)}</span>`;
  }

  // "2026-10-02" -> "02/10/2026"
  function dataBR(iso) {
    if (!iso) return '—';
    const [a, m, d] = iso.split('-');
    return `${d}/${m}/${a}`;
  }

  function dinheiro(valor) {
    if (valor === '' || valor == null) return '—';
    return Number(valor).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }

  function mostrarMensagem(texto, tipo) {
    document.querySelectorAll('.mensagem').forEach(m => m.remove());
    const div = document.createElement('div');
    div.className = 'mensagem' + (tipo === 'erro' ? ' erro' : '');
    div.textContent = texto;
    document.body.appendChild(div);
    setTimeout(() => div.remove(), 4000);
  }

  function mostrarErro(erro) {
    mostrarMensagem(erro && erro.message ? erro.message : String(erro), 'erro');
  }

  function carregando(texto) {
    document.getElementById('tela').innerHTML =
      `<div class="carregando"><div class="girando"></div>${esc(texto || 'Carregando…')}
        <p class="suave pequeno aviso-demora" hidden>O servidor do Google está demorando para responder.
        O primeiro acesso do dia pode levar até 20 segundos.</p></div>`;
    // Se ainda estiver carregando depois de 8 s, explica que é normal na primeira vez
    clearTimeout(estado.timerDemora);
    estado.timerDemora = setTimeout(() => {
      const aviso = document.querySelector('#tela .aviso-demora');
      if (aviso) aviso.hidden = false;
    }, 8000);
  }

  // Lê os campos de um formulário: { NomeDoCampo: valor }
  function lerFormulario(id) {
    const dados = {};
    document.querySelectorAll(`#${id} [name]`).forEach(el => { dados[el.name] = el.value.trim(); });
    return dados;
  }

  function tela(html) {
    document.getElementById('tela').innerHTML = html;
    window.scrollTo(0, 0);
  }

  /* =========================================================
   * Navegação: '#/'  '#/nova'  '#/obra/ID'  '#/obra/ID/comercial'
   * ========================================================= */
  function irPara(rota) {
    const partes = rota.replace('#/', '').split('/').filter(Boolean);
    if (!estado.sessao) return telaEntrar();
    if (partes[0] === 'usuarios' && partes[1]) return telaEditarUsuario(partes[1]);
    if (partes[0] === 'usuarios') return telaUsuarios();
    if (partes[0] === 'nova') return telaNovaObra();
    if (partes[0] === 'obra' && partes[2] === 'comercial') return telaComercial(partes[1]);
    if (partes[0] === 'obra' && partes[2] === 'contrato') return telaContrato(partes[1]);
    if (partes[0] === 'obra' && partes[2] === 'engenharia') return telaEngenharia(partes[1]);
    if (partes[0] === 'obra' && partes[2] === 'compras') return telaCompras(partes[1]);
    if (partes[0] === 'obra' && partes[2] === 'expedicao') return telaExpedicao(partes[1]);
    if (partes[0] === 'obra' && partes[2] === 'gestor') return telaGestor(partes[1]);
    if (partes[0] === 'obra' && partes[2] === 'etapa') return telaEtapa(partes[1], partes[3]);
    if (partes[0] === 'obra') return telaObra(partes[1]);
    return telaHome();
  }

  /* =========================================================
   * Login e sessão
   * ========================================================= */
  function auth() { return estado.auth; }

  function lerLocal(chave) { try { return localStorage.getItem(chave) || ''; } catch (e) { return ''; } }
  function gravarLocal(chave, valor) {
    try { valor ? localStorage.setItem(chave, valor) : localStorage.removeItem(chave); } catch (e) {}
  }

  async function iniciar() {
    carregando();
    estado.auth = { token: lerLocal('tokenSessao'), verComo: lerLocal('verComo') };
    try {
      tratarSituacao(await chamar('iniciarSessao', estado.auth.token));
    } catch (erro) {
      tela(`<div class="tela-login cartao"><h1>Não foi possível carregar</h1>
        <p class="suave">${esc(erro.message || erro)}</p>
        <button class="botao primario largo" onclick="carregando(); iniciar()">Tentar de novo</button></div>`);
    }
  }

  // Decide qual tela mostrar conforme a situação da pessoa
  function tratarSituacao(r, navegar = true) {
    if (r.token) { estado.auth.token = r.token; gravarLocal('tokenSessao', r.token); }
    estado.sessao = null;
    desenharTopo();

    if (r.setores) estado.setoresCadastro = r.setores;
    if (r.situacao === 'sem-login') return telaEntrar();
    if (r.situacao === 'Pendente') return telaAvisoAcesso('Cadastro aguardando aprovação',
      'Seu cadastro foi enviado. Assim que o administrador aprovar, você recebe um e-mail e já pode usar o sistema.');
    if (r.situacao === 'Recusado') return telaAvisoAcesso('Cadastro não aprovado',
      'Seu cadastro não foi aprovado. Fale com o administrador do sistema.');
    if (r.situacao === 'Inativo') return telaAvisoAcesso('Acesso desativado',
      'Seu acesso foi desativado. Fale com o administrador do sistema.');

    // Ativo
    estado.sessao = r.usuario;
    estado.simulaveis = r.simulaveis || [];
    estado.pendentes = r.pendentes || 0;
    const simulado = estado.simulaveis.find(u => u.Email === estado.auth.verComo);
    if (!simulado) { estado.auth.verComo = ''; gravarLocal('verComo', ''); }
    estado.usuario = simulado || estado.sessao;
    desenharTopo();
    if (navegar) irPara(estado.pendentes ? '#/usuarios' : '#/');
  }

  function desenharTopo() {
    const area = document.getElementById('area-usuario');
    const s = estado.sessao;
    if (!s) { area.innerHTML = ''; return; }
    const admin = s.Nivel === 'Administrador';
    const simulando = estado.usuario !== s;
    area.innerHTML = `
      ${admin ? `
        <button class="botao-topo" onclick="irPara('#/usuarios')">Usuários${estado.pendentes ? ` <span class="contador">${estado.pendentes}</span>` : ''}</button>
        <label class="simular">Simular:
          <select onchange="simular(this.value)">
            <option value="">Eu mesma(o)</option>
            ${estado.simulaveis.map(u => `<option value="${esc(u.Email)}" ${u === estado.usuario ? 'selected' : ''}>${esc(u.Nome)} — ${esc(u.Setor)}</option>`).join('')}
          </select>
        </label>` : ''}
      ${simulando ? `<span class="simulando">Vendo como ${esc(estado.usuario.Nome)}</span>` : ''}
      <span class="nome-usuario" title="${esc(s.Email)}">${esc(s.Nome)}</span>
      <button class="botao-topo" onclick="sairDoSistema()">Sair</button>`;
  }

  // Só o administrador: ver o sistema como outro usuário, para testar permissões
  function simular(email) {
    estado.auth.verComo = email;
    gravarLocal('verComo', email);
    estado.usuario = estado.simulaveis.find(u => u.Email === email) || estado.sessao;
    desenharTopo();
    irPara('#/');
  }

  async function sairDoSistema() {
    try { await chamar('sair', estado.auth.token); } catch (e) {}
    encerrarSessaoLocal();
    telaEntrar();
  }

  function encerrarSessaoLocal() {
    gravarLocal('tokenSessao', ''); gravarLocal('verComo', '');
    estado.auth = { token: '', verComo: '' };
    estado.sessao = null; estado.usuario = null;
    desenharTopo();
  }

  function telaEntrar() {
    tela(`
      <div class="tela-login cartao">
        <h1>Entrar</h1>
        <form id="form-entrar" onsubmit="event.preventDefault(); fazerLogin()">
          <div class="campo"><label for="login-email">E-mail</label>
            <input id="login-email" type="email" autocomplete="email" required value="${esc(estado.loginEmail || lerLocal('ultimoEmail'))}"></div>
          <div class="campo"><label for="login-senha">Senha</label>
            <div class="campo-senha"><input id="login-senha" type="password" autocomplete="current-password" required><button type="button" class="ver-senha" onclick="alternarSenha('login-senha', this)" aria-label="Mostrar senha" title="Mostrar senha">${ICONE_OLHO}</button></div></div>
          <button class="botao primario largo" id="btn-entrar">Entrar</button>
        </form>
        <div class="separador">Ainda não tem cadastro?</div>
        <button class="botao largo" onclick="telaCadastro()">Criar cadastro</button>
        <p class="suave pequeno">Esqueceu a senha? Fale com o administrador do sistema.</p>
      </div>`);
    document.getElementById(document.getElementById('login-email').value ? 'login-senha' : 'login-email').focus();
  }

  const ICONE_OLHO = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>`;
  const ICONE_OLHO_FECHADO = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.9 17.9A10.4 10.4 0 0 1 12 19c-7 0-11-7-11-7a18.5 18.5 0 0 1 5.1-5.9M9.9 5.2A9.1 9.1 0 0 1 12 5c7 0 11 7 11 7a18.6 18.6 0 0 1-2.2 3.2M14.1 14.1a3 3 0 1 1-4.2-4.2"/><path d="M1 1l22 22"/></svg>`;

  // Mostra ou esconde a senha digitada
  function alternarSenha(id, botao) {
    const campo = document.getElementById(id);
    const mostrar = campo.type === 'password';
    campo.type = mostrar ? 'text' : 'password';
    botao.innerHTML = mostrar ? ICONE_OLHO_FECHADO : ICONE_OLHO;
    botao.setAttribute('aria-label', mostrar ? 'Esconder senha' : 'Mostrar senha');
    botao.title = mostrar ? 'Esconder senha' : 'Mostrar senha';
    campo.focus();
  }

  async function fazerLogin() {
    const email = document.getElementById('login-email').value.trim();
    const botao = document.getElementById('btn-entrar');
    botao.disabled = true; botao.textContent = 'Entrando…';
    try {
      const r = await chamar('entrar', email, document.getElementById('login-senha').value);
      estado.loginEmail = email; gravarLocal('ultimoEmail', email);
      tratarSituacao(r);
    } catch (erro) {
      mostrarErro(erro);
      botao.disabled = false; botao.textContent = 'Entrar';
    }
  }

  function telaCadastro() {
    const setores = estado.setoresCadastro || [];
    tela(`
      <div class="tela-login cartao">
        <h1>Criar cadastro</h1>
        <p class="suave">Depois de enviar, o administrador analisa o seu cadastro e libera o acesso.</p>
        <form id="form-cadastro" onsubmit="event.preventDefault(); enviarCadastro()">
          <div class="campo"><label for="cad-nome">Nome completo</label><input id="cad-nome" required autocomplete="name"></div>
          <div class="campo"><label for="cad-email">E-mail</label><input id="cad-email" type="email" required autocomplete="email"></div>
          <div class="campo"><label for="cad-tel">Telefone</label><input id="cad-tel" type="tel" autocomplete="tel"></div>
          <div class="campo"><label for="cad-setor">Setor em que você trabalha</label>
            <select id="cad-setor" required><option value="">Selecione…</option>${setores.map(s => `<option>${esc(s)}</option>`).join('')}</select></div>
          <div class="campo"><label for="cad-senha">Senha (mínimo 6 caracteres)</label>
            <div class="campo-senha"><input id="cad-senha" type="password" minlength="6" required autocomplete="new-password"><button type="button" class="ver-senha" onclick="alternarSenha('cad-senha', this)" aria-label="Mostrar senha" title="Mostrar senha">${ICONE_OLHO}</button></div></div>
          <div class="campo"><label for="cad-senha2">Repita a senha</label>
            <div class="campo-senha"><input id="cad-senha2" type="password" minlength="6" required autocomplete="new-password"><button type="button" class="ver-senha" onclick="alternarSenha('cad-senha2', this)" aria-label="Mostrar senha" title="Mostrar senha">${ICONE_OLHO}</button></div></div>
          <button class="botao primario largo" id="btn-cadastrar">Enviar cadastro</button>
        </form>
        <button class="link-voltar" onclick="telaEntrar()">Já tenho cadastro: entrar</button>
      </div>`);
    document.getElementById('cad-nome').focus();
  }

  async function enviarCadastro() {
    const senha = document.getElementById('cad-senha').value;
    if (senha !== document.getElementById('cad-senha2').value) return mostrarMensagem('As senhas não são iguais.', 'erro');
    const botao = document.getElementById('btn-cadastrar');
    botao.disabled = true; botao.textContent = 'Enviando…';
    const email = document.getElementById('cad-email').value.trim();
    try {
      const r = await chamar('cadastrar', {
        Nome: document.getElementById('cad-nome').value.trim(), Email: email,
        Telefone: document.getElementById('cad-tel').value.trim(),
        Setor: document.getElementById('cad-setor').value, Senha: senha
      });
      estado.loginEmail = email; gravarLocal('ultimoEmail', email);
      tratarSituacao(r);
    } catch (erro) {
      mostrarErro(erro);
      botao.disabled = false; botao.textContent = 'Enviar cadastro';
    }
  }

  function telaAvisoAcesso(titulo, texto) {
    tela(`
      <div class="tela-login cartao">
        <h1>${esc(titulo)}</h1>
        <p class="suave">${esc(texto)}</p>
        <button class="botao largo" onclick="iniciar()">Verificar de novo</button>
        <button class="link-voltar" onclick="sairDoSistema()">Sair</button>
      </div>`);
  }

  /* =========================================================
   * TELA 6 – Usuários (só administrador)
   * ========================================================= */
  const SITUACOES_USUARIO = [
    ['Pendente', 'Pendentes'], ['Ativo', 'Ativos'], ['Recusado', 'Recusados'], ['Inativo', 'Desativados']
  ];

  async function telaUsuarios() {
    if (!estado.sessao || estado.sessao.Nivel !== 'Administrador') return irPara('#/');
    carregando('Carregando usuários…');
    try {
      estado.admin = await chamar('listarUsuariosAdmin', auth());
      estado.pendentes = estado.admin.usuarios.filter(u => u.Situacao === 'Pendente').length;
      if (!estado.filtroUsuarios) estado.filtroUsuarios = estado.pendentes ? 'Pendente' : 'Ativo';
      desenharTopo();
      desenharUsuarios();
    } catch (erro) { mostrarErro(erro); }
  }

  function desenharUsuarios() {
    const todos = estado.admin.usuarios;
    const lista = todos.filter(u => u.Situacao === estado.filtroUsuarios);
    const filtros = SITUACOES_USUARIO.map(([sit, rotulo]) => {
      const n = todos.filter(u => u.Situacao === sit).length;
      return `<button class="filtro ${sit === estado.filtroUsuarios ? 'ativo' : ''}"
        onclick="estado.filtroUsuarios='${sit}'; desenharUsuarios()">${rotulo} (${n})</button>`;
    }).join('');

    const linhas = lista.map(u => `
      <tr class="linha-clicavel" onclick="irPara('#/usuarios/${u.ID_Usuario}')">
        <td><strong>${esc(u.Nome)}</strong>${u.Email === estado.sessao.Email ? ' <span class="etiqueta st-em-andamento">Você</span>' : ''}
          <div class="suave pequeno">${esc(u.Email)}</div></td>
        <td>${esc(u.Setor) || '—'}</td>
        <td>${esc(u.Nivel) || '—'}</td>
        <td class="pequeno">${u.Nivel === 'Administrador' ? 'Tudo' : resumoPermissoes(u)}</td>
        <td class="pequeno">${u.Situacao === 'Pendente' ? 'Pediu em ' + dataBR(u.DataSolicitacao) : 'Último acesso: ' + dataBR(u.UltimoAcesso)}</td>
        <td><button class="botao pequeno ${u.Situacao === 'Pendente' ? 'primario' : ''}">${u.Situacao === 'Pendente' ? 'Analisar' : 'Editar'}</button></td>
      </tr>`).join('');

    tela(`
      <a class="link-voltar" onclick="irPara('#/')">← Voltar para as obras</a>
      <div class="cabecalho-obra"><div><h1>Usuários</h1>
        <div class="suave">Aprove os pedidos de acesso e defina o que cada pessoa pode ver e editar.</div></div></div>
      <div class="barra"><div class="filtros">${filtros}</div></div>
      <div class="cartao tabela-rolavel">
        ${lista.length ? `<table class="tabela">
          <thead><tr><th>Pessoa</th><th>Setor</th><th>Nível</th><th>Edita</th><th>Data</th><th></th></tr></thead>
          <tbody>${linhas}</tbody></table>` : `<div class="vazio">Nenhum usuário aqui.</div>`}
      </div>`);
  }

  function resumoPermissoes(u) {
    if (!u.editar.length) return 'Só consulta';
    return esc(u.editar.join(', '));
  }

  // Mesmo padrão do servidor (Codigo.gs > permissoesPadrao_)
  function permissoesPadrao(setor, nivel) {
    const setores = estado.admin.setores;
    if (nivel === 'Administrador') return { ver: setores.slice(), editar: setores.slice() };
    const proprio = setores.includes(setor) ? [setor] : [];
    if (nivel === 'Gestão') return { ver: setores.slice(), editar: proprio };
    const ate = setores.indexOf(setor);
    return { ver: ate === -1 ? [] : setores.slice(0, ate + 1), editar: proprio };
  }

  async function telaEditarUsuario(id) {
    if (!estado.admin) {
      carregando('Carregando usuário…');
      try { estado.admin = await chamar('listarUsuariosAdmin', auth()); } catch (erro) { mostrarErro(erro); return irPara('#/'); }
    }
    const u = estado.admin.usuarios.find(x => x.ID_Usuario === id);
    if (!u) return irPara('#/usuarios');
    const voce = u.Email === estado.sessao.Email;
    const pendente = u.Situacao === 'Pendente';
    // Pedido novo: já sugere as permissões padrão do setor escolhido pela pessoa
    const perm = pendente ? permissoesPadrao(u.Setor, u.Nivel || 'Operacional') : { ver: u.ver, editar: u.editar };

    const opcoes = (lista, atual) => lista.map(o => `<option ${o === atual ? 'selected' : ''}>${esc(o)}</option>`).join('');
    const matriz = estado.admin.setores.map((s, i) => `
      <tr>
        <td>${i + 1}. ${esc(s)}</td>
        <td class="centro"><input type="checkbox" id="ver-${i}" data-setor="${esc(s)}" ${perm.ver.includes(s) ? 'checked' : ''} onchange="ajustarMatriz(${i}, 'ver')"></td>
        <td class="centro"><input type="checkbox" id="edit-${i}" data-setor="${esc(s)}" ${perm.editar.includes(s) ? 'checked' : ''} onchange="ajustarMatriz(${i}, 'edit')"></td>
      </tr>`).join('');

    let botoes = '';
    if (pendente) {
      botoes = `<button class="botao" onclick="salvarUsuarioAdmin('${id}', 'Recusado')">Recusar</button>
                <button class="botao sucesso" onclick="salvarUsuarioAdmin('${id}', 'Ativo')">Aprovar acesso</button>`;
    } else if (u.Situacao === 'Ativo') {
      botoes = `${voce ? '' : `<button class="botao" onclick="salvarUsuarioAdmin('${id}', 'Inativo')">Desativar acesso</button>`}
                <button class="botao primario" onclick="salvarUsuarioAdmin('${id}', 'Ativo')">Salvar</button>`;
    } else {
      botoes = `<button class="botao sucesso" onclick="salvarUsuarioAdmin('${id}', 'Ativo')">Liberar acesso</button>`;
    }

    tela(`
      <a class="link-voltar" onclick="irPara('#/usuarios')">← Voltar para usuários</a>
      <div class="cabecalho-obra"><div>
        <h1>${esc(u.Nome)}</h1>
        <div class="suave">${esc(u.Email)}</div>
        <div class="etiquetas">${etiqueta(u.Situacao)}</div>
      </div></div>

      ${pendente ? `<div class="aviso info">Pediu acesso em ${dataBR(u.DataSolicitacao)}. Confira o setor e o nível, ajuste as permissões e clique em "Aprovar acesso". A pessoa recebe um e-mail avisando.</div>` : ''}
      ${voce ? `<div class="aviso info">Este é o seu usuário. Você não pode tirar o seu próprio acesso de administrador.</div>` : ''}

      <div class="cartao secao">
        <h2>Dados</h2>
        <div class="campos">
          <div class="campo"><label for="u-nome">Nome</label><input id="u-nome" value="${esc(u.Nome)}"></div>
          <div class="campo"><label for="u-tel">Telefone</label><input id="u-tel" value="${esc(u.Telefone)}"></div>
          <div class="campo"><label for="u-setor">Setor</label>
            <select id="u-setor" onchange="aplicarPadrao()"><option value="">Selecione…</option>${opcoes(estado.admin.setoresUsuario, u.Setor)}</select></div>
          <div class="campo"><label for="u-nivel">Nível de acesso</label>
            <select id="u-nivel" onchange="aplicarPadrao()" ${voce ? 'disabled' : ''}>${opcoes(estado.admin.niveis, u.Nivel || 'Operacional')}</select></div>
        </div>
        <label class="opcao"><input type="checkbox" id="u-cadastrar" ${u.PodeCadastrarObra ? 'checked' : ''}> Pode cadastrar obras novas</label>
        ${pendente ? '' : `
        <div class="campos" style="margin-top:14px">
          <div class="campo"><label for="u-senha">Nova senha (só se a pessoa esqueceu)</label>
            <input id="u-senha" type="text" autocomplete="off" placeholder="Deixe em branco para manter"></div>
        </div>`}
      </div>

      <div class="cartao secao">
        <div class="cabecalho-obra" style="margin-bottom:8px"><h2>O que pode acessar</h2>
          <button class="botao pequeno" onclick="aplicarPadrao()">Voltar ao padrão do nível</button></div>
        <p class="suave pequeno" id="nota-matriz"></p>
        <div class="tabela-rolavel"><table class="tabela matriz">
          <thead><tr><th>Setor</th><th class="centro">Ver</th><th class="centro">Editar</th></tr></thead>
          <tbody>${matriz}</tbody>
        </table></div>
      </div>

      <div class="acoes">${botoes}</div>
    `);
    atualizarNotaMatriz();
  }

  // Editar inclui ver; tirar o "ver" tira o "editar"
  function ajustarMatriz(i, coluna) {
    const ver = document.getElementById('ver-' + i), edit = document.getElementById('edit-' + i);
    if (coluna === 'edit' && edit.checked) ver.checked = true;
    if (coluna === 'ver' && !ver.checked) edit.checked = false;
  }

  function aplicarPadrao() {
    const nivel = document.getElementById('u-nivel').value;
    const p = permissoesPadrao(document.getElementById('u-setor').value, nivel);
    estado.admin.setores.forEach((s, i) => {
      document.getElementById('ver-' + i).checked = p.ver.includes(s);
      document.getElementById('edit-' + i).checked = p.editar.includes(s);
    });
    if (nivel === 'Administrador') document.getElementById('u-cadastrar').checked = true;
    atualizarNotaMatriz();
  }

  function atualizarNotaMatriz() {
    const admin = document.getElementById('u-nivel').value === 'Administrador';
    document.querySelectorAll('.matriz input').forEach(c => { c.disabled = admin; });
    document.getElementById('nota-matriz').textContent = admin
      ? 'Administrador vê e edita todos os setores e gerencia os usuários.'
      : 'Padrão: Operacional vê o seu setor e os anteriores e edita o seu; Gestão vê todos e edita o seu. Ajuste caso a caso se precisar.';
  }

  async function salvarUsuarioAdmin(id, situacao) {
    const marcados = prefixo => Array.from(document.querySelectorAll(`.matriz input[id^="${prefixo}-"]`))
      .filter(c => c.checked).map(c => c.dataset.setor);
    const dados = {
      Nome: document.getElementById('u-nome').value.trim(),
      Telefone: document.getElementById('u-tel').value.trim(),
      Setor: document.getElementById('u-setor').value,
      Nivel: document.getElementById('u-nivel').value,
      PodeCadastrarObra: document.getElementById('u-cadastrar').checked,
      ver: marcados('ver'), editar: marcados('edit'), Situacao: situacao,
      NovaSenha: (document.getElementById('u-senha') || {}).value || ''
    };
    if (situacao === 'Recusado' && !confirm('Recusar o acesso de ' + dados.Nome + '?')) return;
    if (situacao === 'Inativo' && !confirm('Desativar o acesso de ' + dados.Nome + '? O histórico dele continua guardado.')) return;
    document.querySelectorAll('.acoes .botao').forEach(b => b.disabled = true);
    try {
      const salvo = await chamar('salvarUsuario', auth(), id, dados);
      const i = estado.admin.usuarios.findIndex(u => u.ID_Usuario === id);
      estado.admin.usuarios[i] = salvo;
      const msgs = { Ativo: dados.NovaSenha ? 'Salvo! Passe a nova senha para a pessoa.' : 'Acesso liberado e salvo!', Recusado: 'Solicitação recusada.', Inativo: 'Acesso desativado.' };
      mostrarMensagem(msgs[situacao]);
      estado.filtroUsuarios = situacao;
      // Atualiza o seletor "Simular" e o contador de pendentes
      tratarSituacao(await chamar('iniciarSessao', estado.auth.token), false);
      irPara('#/usuarios');
    } catch (erro) {
      mostrarErro(erro);
      document.querySelectorAll('.acoes .botao').forEach(b => b.disabled = false);
    }
  }

  /* =========================================================
   * TELA 1 – Home (cartões das obras)
   * ========================================================= */
  async function telaHome() {
    carregando('Carregando obras…');
    try {
      estado.obras = await chamar('listarObras', auth());
      desenharHome();
    } catch (erro) { mostrarErro(erro); }
  }

  function desenharHome() {
    const podeCadastrar = estado.usuario && estado.usuario.PodeCadastrarObra === true;
    const filtros = ['Todas', ...STATUS, 'Atrasadas'];

    tela(`
      <div class="cabecalho-obra">
        <div>
          <h1>Obras</h1>
          <div class="suave">${estado.obras.length} obras cadastradas</div>
        </div>
        ${podeCadastrar ? `<button class="botao primario" onclick="irPara('#/nova')">+ Nova obra</button>` : ''}
      </div>

      <div class="barra">
        <input class="busca" id="busca" placeholder="Buscar por código, cliente ou endereço…"
               value="${esc(estado.busca)}" oninput="estado.busca = this.value; desenharCartoes()">
        <div class="filtros">
          ${filtros.map(f => `<button class="filtro ${f === estado.filtro ? 'ativo' : ''}"
               onclick="estado.filtro = '${f}'; desenharHome()">${f}</button>`).join('')}
        </div>
      </div>

      <div id="cartoes" class="grade"></div>
    `);
    desenharCartoes();
  }

  function desenharCartoes() {
    const busca = estado.busca.toLowerCase();
    const lista = estado.obras.filter(o => {
      if (estado.filtro === 'Atrasadas' && !o.Atrasada) return false;
      if (STATUS.includes(estado.filtro) && o.Status !== estado.filtro) return false;
      return [o.Codigo, o.Cliente, o.Endereco].join(' ').toLowerCase().includes(busca);
    });

    document.getElementById('cartoes').innerHTML = lista.length ? lista.map(o => `
      <div class="cartao cartao-obra" onclick="irPara('#/obra/${o.ID_Obra}')">
        <div class="linha1">
          <span class="codigo">${esc(o.Codigo)}</span>
          <span>${o.Atrasada ? etiqueta('Atrasada') + ' ' : ''}${etiqueta(o.Status)}</span>
        </div>
        <div class="cliente">${esc(o.Cliente)}</div>
        <div class="endereco">${esc(o.Endereco)}</div>
        <div class="progresso"><div style="width:${o.Andamento}%"></div></div>
        <div class="rodape-cartao">
          <span>${o.Andamento}% concluído</span>
          <span>Prazo: ${dataBR(o.TerminoPrevisto)}</span>
        </div>
      </div>`).join('') : `<div class="vazio">Nenhuma obra encontrada.</div>`;
  }

  /* =========================================================
   * TELA 2 – Cadastro de obra
   * ========================================================= */
  function telaNovaObra() {
    if (!estado.usuario || estado.usuario.PodeCadastrarObra !== true) {
      mostrarMensagem('Você não tem permissão para cadastrar obras.', 'erro');
      return irPara('#/');
    }
    tela(`
      <a class="link-voltar" onclick="irPara('#/')">← Voltar para as obras</a>
      <h1>Nova obra</h1>
      <p class="suave">O código (ex.: OB-006) é gerado automaticamente ao salvar.</p>

      <div class="cartao">
        <div class="campos" id="form-nova">
          <div class="campo"><label>Cliente *</label><input name="Cliente" placeholder="Nome completo"></div>
          <div class="campo"><label>Modelo da casa</label><input name="ModeloCasa" placeholder="Ex.: Casa Ipê 120 m²"></div>
          <div class="campo largo"><label>Endereço da obra (terreno)</label><input name="Endereco"></div>
          <div class="campo"><label>Início previsto</label><input type="date" name="InicioPrevisto"></div>
          <div class="campo"><label>Término previsto</label><input type="date" name="TerminoPrevisto"></div>
          <div class="campo largo"><label>Observações</label><textarea name="Observacoes"></textarea></div>
        </div>
        <div class="acoes">
          <button class="botao" onclick="irPara('#/')">Cancelar</button>
          <button class="botao primario" id="btn-salvar" onclick="salvarNovaObra()">Salvar obra</button>
        </div>
      </div>
    `);
  }

  async function salvarNovaObra() {
    const dados = lerFormulario('form-nova');
    if (!dados.Cliente) return mostrarMensagem('Informe o nome do cliente.', 'erro');
    const botao = document.getElementById('btn-salvar');
    botao.disabled = true; botao.textContent = 'Salvando…';
    try {
      const idObra = await chamar('cadastrarObra', dados, auth());
      mostrarMensagem('Obra cadastrada!');
      irPara('#/obra/' + idObra);
    } catch (erro) {
      mostrarErro(erro);
      botao.disabled = false; botao.textContent = 'Salvar obra';
    }
  }

  /* =========================================================
   * TELA 3 – Página da obra (dados + boxes dos setores)
   * ========================================================= */
  async function telaObra(idObra) {
    carregando('Abrindo obra…');
    try {
      estado.obraAberta = await chamar('abrirObra', idObra, auth());
      desenharObra();
    } catch (erro) { mostrarErro(erro); irPara('#/'); }
  }

  // Campos básicos da obra: [nome na planilha, rótulo, tipo]
  const CAMPOS_OBRA = [
    ['Cliente', 'Cliente', 'texto'],
    ['ModeloCasa', 'Modelo da casa', 'texto'],
    ['Endereco', 'Endereço da obra', 'texto', 'largo'],
    ['InicioPrevisto', 'Início previsto', 'data'],
    ['TerminoPrevisto', 'Término previsto', 'data'],
    ['InicioReal', 'Início real', 'data'],
    ['TerminoReal', 'Término real', 'data'],
    ['Status', 'Status', 'status'],
    ['Observacoes', 'Observações', 'textoLongo', 'largo']
  ];

  function desenharObra() {
    const { obra, etapas, camposObraEditaveis } = estado.obraAberta;
    const editaveis = camposObraEditaveis || [];

    const campos = CAMPOS_OBRA.map(([nome, rotulo, tipo, largura]) => {
      const valor = obra[nome] ?? '';
      let conteudo;
      if (!editaveis.includes(nome)) {
        conteudo = `<div class="valor">${tipo === 'data' ? dataBR(valor) : esc(valor) || '—'}</div>`;
      } else if (tipo === 'data') {
        conteudo = `<input type="date" name="${nome}" value="${esc(valor)}">`;
      } else if (tipo === 'status') {
        conteudo = `<select name="${nome}">${STATUS.map(s =>
          `<option ${s === valor ? 'selected' : ''}>${s}</option>`).join('')}</select>`;
      } else if (tipo === 'textoLongo') {
        conteudo = `<textarea name="${nome}">${esc(valor)}</textarea>`;
      } else {
        conteudo = `<input name="${nome}" value="${esc(valor)}">`;
      }
      return `<div class="campo ${largura || ''}"><label>${rotulo}</label>${conteudo}</div>`;
    }).join('');

    const boxes = etapas.map((e, i) => e.Liberado ? `
      <div class="box-setor liberado" onclick="abrirSetor('${e.ID_Etapa}')">
        <div class="ordem">${i + 1}</div>
        <div class="nome">${esc(e.Setor)}</div>
        <div>${etiqueta(e.Situacao)}</div>
        <div class="detalhe">${esc(e.Progresso || (e.DataConclusao ? 'Concluído em ' + dataBR(e.DataConclusao) : ''))}</div>
      </div>` : `
      <div class="box-setor bloqueado" title="Você não tem acesso a este setor">
        <svg class="cadeado" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <div class="ordem">${i + 1}</div>
        <div class="nome">${esc(e.Setor)}</div>
        <div class="detalhe">Você não tem acesso a este setor</div>
      </div>`).join('');

    tela(`
      <a class="link-voltar" onclick="irPara('#/')">← Voltar para as obras</a>

      <div class="cabecalho-obra">
        <div>
          <div class="codigo">${esc(obra.Codigo)}</div>
          <h1>${esc(obra.Cliente)}</h1>
          <div class="suave">${esc(obra.Endereco)}</div>
          <div class="etiquetas">${etiqueta(obra.Status)}${obra.Atrasada ? etiqueta('Atrasada') : ''}</div>
        </div>
        <div class="cartao resumo-andamento">
          <div class="suave">Andamento</div>
          <div class="numero">${obra.Andamento}%</div>
          <div class="progresso"><div style="width:${obra.Andamento}%"></div></div>
          <div class="suave" style="margin-top:8px;font-size:13px">
            ${obra.SetorAtual ? 'Etapa atual: ' + esc(obra.SetorAtual) : 'Todas as etapas concluídas'}
          </div>
        </div>
      </div>

      <div class="cartao secao">
        <h2>Dados da obra</h2>
        <div class="campos" id="form-obra">${campos}</div>
        ${editaveis.length ? `
          <div class="acoes">
            <button class="botao primario" id="btn-salvar-obra" onclick="salvarDadosObra()">Salvar alterações</button>
          </div>` : ''}
      </div>

      <h2>Setores</h2>
      <div class="setores">${boxes}</div>
    `);
  }

  async function salvarDadosObra() {
    const botao = document.getElementById('btn-salvar-obra');
    botao.disabled = true; botao.textContent = 'Salvando…';
    try {
      await chamar('salvarObra', estado.obraAberta.obra.ID_Obra, lerFormulario('form-obra'), auth());
      mostrarMensagem('Dados da obra salvos!');
      telaObra(estado.obraAberta.obra.ID_Obra);
    } catch (erro) {
      mostrarErro(erro);
      botao.disabled = false; botao.textContent = 'Salvar alterações';
    }
  }

  function abrirSetor(idEtapa) {
    const idObra = estado.obraAberta.obra.ID_Obra;
    const etapa = estado.obraAberta.etapas.find(e => e.ID_Etapa === idEtapa);
    if (etapa.Setor === 'Comercial') return irPara('#/obra/' + idObra + '/comercial');
    if (etapa.Setor === 'Contrato') return irPara('#/obra/' + idObra + '/contrato');
    if (etapa.Setor === 'Engenharia') return irPara('#/obra/' + idObra + '/engenharia');
    if (etapa.Setor === 'Compras') return irPara('#/obra/' + idObra + '/compras');
    if (etapa.Setor === 'Expedição') return irPara('#/obra/' + idObra + '/expedicao');
    if (etapa.Setor === 'Gestor') return irPara('#/obra/' + idObra + '/gestor');
    irPara('#/obra/' + idObra + '/etapa/' + idEtapa);
  }

  /* =========================================================
   * TELA 5 – Etapa de um setor (Contrato em diante)
   * Por enquanto: situação e observações. Os campos próprios de
   * cada setor entram um por vez nas próximas etapas do projeto.
   * ========================================================= */
  const SITUACOES_ETAPA = ['Não iniciado', 'Aguardando', 'Em andamento', 'Concluído'];

  async function telaEtapa(idObra, idEtapa) {
    carregando('Abrindo setor…');
    try {
      estado.obraAberta = await chamar('abrirObra', idObra, auth());
      const etapa = estado.obraAberta.etapas.find(e => e.ID_Etapa === idEtapa);
      if (!etapa || !etapa.Liberado) {
        mostrarMensagem('Você não tem acesso a este setor.', 'erro');
        return desenharObra();
      }
      desenharEtapa(etapa);
    } catch (erro) { mostrarErro(erro); irPara('#/'); }
  }

  function desenharEtapa(etapa) {
    const { obra, etapas } = estado.obraAberta;
    const indice = etapas.indexOf(etapa);
    const anterior = etapas[indice - 1];
    const editavel = etapa.PodeEditar;
    const concluida = etapa.Situacao === 'Concluído';

    let aviso = '';
    if (!editavel) {
      aviso = `<div class="aviso info">Você está vendo esta etapa apenas para consulta.</div>`;
    } else if (anterior && anterior.Situacao !== 'Concluído') {
      aviso = `<div class="aviso">A etapa anterior (${esc(anterior.Setor)}) ainda está como
        "${esc(anterior.Situacao)}". Você pode trabalhar nesta etapa mesmo assim.</div>`;
    }

    const situacao = editavel
      ? `<select name="Situacao">${SITUACOES_ETAPA.map(s =>
          `<option ${s === etapa.Situacao ? 'selected' : ''}>${s}</option>`).join('')}</select>`
      : `<div class="valor">${etiqueta(etapa.Situacao)}</div>`;
    const observacoes = editavel
      ? `<textarea name="Observacoes" placeholder="Anotações desta etapa…">${esc(etapa.Observacoes)}</textarea>`
      : `<div class="valor">${esc(etapa.Observacoes) || '—'}</div>`;

    tela(`
      <a class="link-voltar" onclick="irPara('#/obra/${obra.ID_Obra}')">← Voltar para a obra ${esc(obra.Codigo)}</a>
      <div class="cabecalho-obra">
        <div>
          <div class="codigo">${esc(obra.Codigo)} · ${esc(etapa.Setor).toUpperCase()}</div>
          <h1>${esc(obra.Cliente)}</h1>
          <div class="etiquetas">${etiqueta(etapa.Situacao)}</div>
        </div>
      </div>

      ${aviso}

      <div class="cartao secao">
        <h2>Andamento da etapa</h2>
        <div class="campos" id="form-etapa">
          <div class="campo"><label>Situação</label>${situacao}</div>
          <div class="campo"><label>Início</label><div class="valor">${dataBR(etapa.DataInicio)}</div></div>
          <div class="campo"><label>Conclusão</label><div class="valor">${dataBR(etapa.DataConclusao)}</div></div>
          <div class="campo"><label>Última atualização por</label><div class="valor">${esc(etapa.Responsavel) || '—'}</div></div>
          <div class="campo largo"><label>Observações</label>${observacoes}</div>
        </div>
        ${editavel ? `
          <div class="acoes">
            <button class="botao" id="btn-salvar-etapa" onclick="salvarEtapa('${etapa.ID_Etapa}')">Salvar</button>
            ${!concluida ? `<button class="botao sucesso" id="btn-concluir-etapa"
                onclick="salvarEtapa('${etapa.ID_Etapa}', true)">Concluir etapa →</button>` : ''}
          </div>` : ''}
      </div>

      <div class="aviso info">Os campos específicos do setor ${esc(etapa.Setor)} serão adicionados nas próximas etapas do projeto.</div>
    `);
  }

  async function salvarEtapa(idEtapa, concluir) {
    const dados = lerFormulario('form-etapa');
    if (concluir) {
      const etapa = estado.obraAberta.etapas.find(e => e.ID_Etapa === idEtapa);
      if (!confirm(`Concluir a etapa ${etapa.Setor}? O próximo setor passa para "Aguardando".`)) return;
      dados.Situacao = 'Concluído';
    }
    document.querySelectorAll('#btn-salvar-etapa, #btn-concluir-etapa').forEach(b => b.disabled = true);
    try {
      await chamar('atualizarEtapa', idEtapa, dados, auth());
      mostrarMensagem(concluir ? 'Etapa concluída!' : 'Etapa salva!');
      telaObra(estado.obraAberta.obra.ID_Obra);
    } catch (erro) {
      mostrarErro(erro);
      document.querySelectorAll('#btn-salvar-etapa, #btn-concluir-etapa').forEach(b => b.disabled = false);
    }
  }

  /* =========================================================
   * TELA 4 – Setor Comercial
   * ========================================================= */
  async function telaComercial(idObra) {
    carregando('Abrindo Comercial…');
    try {
      estado.obraAberta = await chamar('abrirObra', idObra, auth());
      const etapa = estado.obraAberta.etapas.find(e => e.Setor === 'Comercial');
      if (!etapa || !etapa.Liberado) {
        mostrarMensagem('Você não tem acesso a este setor.', 'erro');
        return desenharObra();
      }
      desenharComercial();
    } catch (erro) { mostrarErro(erro); irPara('#/'); }
  }

  // Seções da ficha do Comercial: [título, [[campo, rótulo, tipo, opções/largura]]]
  const SECOES_COMERCIAL = [
    ['Cliente', [
      ['NomeCliente', 'Nome', 'texto'],
      ['CPF', 'CPF', 'texto'],
      ['Telefone', 'Telefone', 'texto'],
      ['Email', 'E-mail', 'texto'],
      ['EnderecoAtual', 'Endereço atual', 'texto', 'largo']
    ]],
    ['Terreno', [
      ['EnderecoTerreno', 'Endereço do terreno (endereço da obra)', 'texto', 'largo'],
      ['LoteQuadra', 'Lote / quadra', 'texto'],
      ['Matricula', 'Matrícula', 'texto'],
      ['TerrenoDoCliente', 'Terreno é do cliente? (Não = vendido junto)', ['Sim', 'Não']]
    ]],
    ['Venda', [
      ['Metragem', 'Metragem (m²)', 'numero'],
      ['ValorFechado', 'Valor fechado (R$)', 'dinheiro'],
      ['Vendedor', 'Vendedor responsável', 'texto'],
      ['PrazoPrometido', 'Prazo prometido ao cliente', 'data'],
      ['Personalizacoes', 'Personalizações vendidas', 'textoLongo', 'largo']
    ]],
    ['Pagamento', [
      ['FormaPagamento', 'Forma de pagamento', ['À vista', 'Parcelado direto', 'Financiamento']],
      ['QtdParcelas', 'Quantidade de parcelas', 'numero', 'so-parcelado'],
      ['JurosMensal', 'Juros (% ao mês)', 'numero', 'so-parcelado'],
      ['ResumoParcelas', 'Parcelamento', 'resumo', 'largo so-parcelado'],
      ['Banco', 'Banco do financiamento', 'texto', 'so-financiamento']
    ]],
    ['Observações', [
      ['ObservacoesNegociacao', 'Observações da negociação', 'textoLongo', 'largo']
    ]]
  ];

  function desenharComercial() {
    const { obra, comercial, documentos, podeEditarComercial } = estado.obraAberta;
    const enviado = comercial.Situacao === 'Enviado para Contrato';
    const admin = estado.usuario.Nivel === 'Administrador';
    const editavel = podeEditarComercial && (!enviado || admin);

    const campo = ([nome, rotulo, tipo, largura]) => {
      const valor = comercial[nome] ?? '';
      let conteudo;
      // Campos que mudam o cálculo das parcelas recalculam na hora
      const recalcula = ['FormaPagamento', 'QtdParcelas', 'JurosMensal', 'ValorFechado'].includes(nome)
        ? ' oninput="atualizarPagamento()" onchange="atualizarPagamento()"' : '';
      if (tipo === 'resumo') {
        conteudo = `<div class="valor resumo-parcelas" id="resumo-parcelas"></div>`;
      } else if (!editavel) {
        const texto = tipo === 'data' ? dataBR(valor) : tipo === 'dinheiro' ? dinheiro(valor) : esc(valor) || '—';
        conteudo = `<div class="valor">${texto}</div>`;
      } else if (Array.isArray(tipo)) {
        conteudo = `<select name="${nome}"${recalcula}><option value="">Selecione…</option>${tipo.map(op =>
          `<option ${op === valor ? 'selected' : ''}>${op}</option>`).join('')}</select>`;
      } else if (tipo === 'textoLongo') {
        conteudo = `<textarea name="${nome}">${esc(valor)}</textarea>`;
      } else {
        const tipoInput = tipo === 'data' ? 'date' : (tipo === 'numero' || tipo === 'dinheiro') ? 'number' : 'text';
        const passo = tipoInput === 'number' ? ' step="any" min="0"' : '';
        conteudo = `<input type="${tipoInput}" name="${nome}" value="${esc(valor)}"${passo}${recalcula}>`;
      }
      return `<div class="campo ${largura || ''}"><label>${rotulo}</label>${conteudo}</div>`;
    };

    const secoes = SECOES_COMERCIAL.map(([titulo, campos]) => `
      <div class="cartao secao">
        <h2>${titulo}</h2>
        <div class="campos">${campos.map(campo).join('')}</div>
      </div>`).join('');

    const obrigatorios = documentos.filter(d => d.Obrigatorio);
    const recebidos = obrigatorios.filter(d => d.Recebido);
    const checklistCompleto = recebidos.length === obrigatorios.length;

    const checklist = documentos.map(d => `
      <li id="doc-${d.ID_Documento}">
        <input type="checkbox" ${d.Recebido ? 'checked' : ''} ${editavel ? '' : 'disabled'}
               onchange="alternarDocumento('${d.ID_Documento}', this)">
        <span>${esc(d.TipoDocumento)}</span>
        ${d.Obrigatorio ? '<span class="obrig">OBRIGATÓRIO</span>' : ''}
        <span class="anexo">
          ${d.Arquivo ? `<a class="ver-arquivo" href="${esc(d.Arquivo)}" target="_blank" rel="noopener">${ICONE_CLIPE} Ver arquivo</a>` : ''}
          ${editavel ? `
            <input type="file" id="arq-${d.ID_Documento}" accept=".pdf,image/*" hidden
                   onchange="enviarArquivo('${d.ID_Documento}', this)">
            <button class="botao pequeno" onclick="document.getElementById('arq-${d.ID_Documento}').click()">
              ${d.Arquivo ? 'Trocar' : 'Anexar'}
            </button>
            ${d.Arquivo ? `<button class="botao pequeno perigo" onclick="removerArquivo('${d.ID_Documento}')">Remover</button>` : ''}
          ` : (!d.Arquivo ? '<span class="suave">Sem anexo</span>' : '')}
        </span>
      </li>`).join('');

    let aviso = '';
    if (enviado) aviso = `<div class="aviso ok">Ficha concluída e enviada para o setor de Contrato.</div>`;
    else if (!podeEditarComercial) aviso = `<div class="aviso info">Você está vendo esta ficha apenas para consulta.</div>`;
    else if (!checklistCompleto) aviso = `<div class="aviso">Para enviar ao Contrato, marque todos os documentos obrigatórios (${recebidos.length} de ${obrigatorios.length}).</div>`;

    tela(`
      <a class="link-voltar" onclick="irPara('#/obra/${obra.ID_Obra}')">← Voltar para a obra ${esc(obra.Codigo)}</a>
      <div class="cabecalho-obra">
        <div>
          <div class="codigo">${esc(obra.Codigo)} · COMERCIAL</div>
          <h1>${esc(obra.Cliente)}</h1>
          <div class="etiquetas">${etiqueta(comercial.Situacao || 'Em preenchimento')}</div>
        </div>
      </div>

      ${aviso}

      <div id="form-comercial">${secoes}</div>

      <div class="cartao secao">
        <h2>Documentos do cliente</h2>
        <ul class="checklist">${checklist}</ul>
      </div>

      ${editavel ? `
        <div class="acoes">
          <button class="botao" id="btn-salvar-com" onclick="salvarFichaComercial()">Salvar</button>
          ${!enviado ? `<button class="botao sucesso" id="btn-enviar" onclick="enviarContrato()"
              ${checklistCompleto ? '' : 'disabled'}>Enviar para Contrato →</button>` : ''}
        </div>` : ''}
    `);
    atualizarPagamento();
  }

  // Mostra os campos de parcelas ou de banco conforme a forma de pagamento e calcula as parcelas
  function atualizarPagamento() {
    const c = estado.obraAberta.comercial;
    const ler = nome => { const el = document.querySelector(`#form-comercial [name="${nome}"]`); return el ? el.value : c[nome]; };
    const forma = ler('FormaPagamento');
    document.querySelectorAll('#form-comercial .so-parcelado').forEach(el => { el.hidden = forma !== 'Parcelado direto'; });
    document.querySelectorAll('#form-comercial .so-financiamento').forEach(el => { el.hidden = forma !== 'Financiamento'; });
    const resumo = document.getElementById('resumo-parcelas');
    if (!resumo) return;
    const valor = Number(String(ler('ValorFechado') ?? '').replace(',', '.'));
    const n = parseInt(ler('QtdParcelas'), 10);
    const juros = Number(String(ler('JurosMensal') ?? '').replace(',', '.')) || 0;
    if (!(valor > 0) || !(n >= 1)) {
      resumo.innerHTML = '<span class="suave">Informe o valor fechado e a quantidade de parcelas.</span>';
      return;
    }
    const i = juros / 100;
    const parcela = i === 0 ? valor / n : valor * i / (1 - Math.pow(1 + i, -n));
    const total = parcela * n;
    resumo.innerHTML = `<strong>${n}x de ${dinheiro(parcela)}</strong> · total ${dinheiro(total)} · ` +
      (i === 0 ? 'sem juros' : `juros de ${dinheiro(total - valor)} (${String(juros).replace('.', ',')}% ao mês)`);
  }

  async function salvarFichaComercial(silencioso) {
    const botao = document.getElementById('btn-salvar-com');
    botao.disabled = true; botao.textContent = 'Salvando…';
    try {
      const dados = lerFormulario('form-comercial');
      await chamar('salvarComercial', estado.obraAberta.obra.ID_Obra, dados, auth());
      Object.assign(estado.obraAberta.comercial, dados);
      if (!silencioso) mostrarMensagem('Ficha do Comercial salva!');
      return true;
    } catch (erro) {
      mostrarErro(erro);
      return false;
    } finally {
      botao.disabled = false; botao.textContent = 'Salvar';
    }
  }

  async function alternarDocumento(idDocumento, caixa) {
    caixa.disabled = true;
    try {
      await chamar('marcarDocumento', idDocumento, caixa.checked, auth());
      const doc = estado.obraAberta.documentos.find(d => d.ID_Documento === idDocumento);
      doc.Recebido = caixa.checked;
      // Guarda o que já foi digitado antes de redesenhar a tela
      Object.assign(estado.obraAberta.comercial, lerFormulario('form-comercial'));
      desenharComercial();
    } catch (erro) {
      caixa.checked = !caixa.checked;
      caixa.disabled = false;
      mostrarErro(erro);
    }
  }

  const ICONE_CLIPE = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.4 11.1l-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>`;
  const TAMANHO_MAXIMO_MB = 10;

  // Lê o arquivo escolhido, converte para texto (base64) e envia para o Drive
  async function enviarArquivo(idDocumento, campo) {
    const arquivo = campo.files[0];
    if (!arquivo) return;
    if (arquivo.size > TAMANHO_MAXIMO_MB * 1024 * 1024) {
      campo.value = '';
      return mostrarMensagem(`O arquivo passa de ${TAMANHO_MAXIMO_MB} MB. Envie um arquivo menor.`, 'erro');
    }

    const linha = document.getElementById('doc-' + idDocumento);
    linha.querySelectorAll('button, input').forEach(el => el.disabled = true);
    linha.querySelector('.anexo').insertAdjacentHTML('afterbegin', '<span class="suave">Enviando…</span>');

    try {
      const base64 = await new Promise((resolve, reject) => {
        const leitor = new FileReader();
        leitor.onload = () => resolve(leitor.result.split(',')[1]);
        leitor.onerror = () => reject(new Error('Não foi possível ler o arquivo.'));
        leitor.readAsDataURL(arquivo);
      });
      const resposta = await chamar('anexarDocumento', idDocumento,
        { nome: arquivo.name, tipo: arquivo.type || 'application/octet-stream', base64 }, auth());
      Object.assign(estado.obraAberta.documentos.find(d => d.ID_Documento === idDocumento), resposta);
      mostrarMensagem('Arquivo anexado!');
    } catch (erro) {
      mostrarErro(erro);
    }
    Object.assign(estado.obraAberta.comercial, lerFormulario('form-comercial'));
    desenharComercial();
  }

  async function removerArquivo(idDocumento) {
    if (!confirm('Remover o arquivo anexado? Ele vai para a lixeira do Google Drive.')) return;
    try {
      await chamar('removerAnexo', idDocumento, auth());
      Object.assign(estado.obraAberta.documentos.find(d => d.ID_Documento === idDocumento),
        { Arquivo: '', Recebido: false });
      mostrarMensagem('Anexo removido.');
    } catch (erro) {
      mostrarErro(erro);
    }
    Object.assign(estado.obraAberta.comercial, lerFormulario('form-comercial'));
    desenharComercial();
  }

  async function enviarContrato() {
    if (!confirm('Enviar esta ficha para o setor de Contrato? Depois disso ela fica só para consulta.')) return;
    const salvou = await salvarFichaComercial(true);
    if (!salvou) return;
    const botao = document.getElementById('btn-enviar');
    botao.disabled = true; botao.textContent = 'Enviando…';
    try {
      await chamar('enviarParaContrato', estado.obraAberta.obra.ID_Obra, auth());
      mostrarMensagem('Enviado para o Contrato!');
      telaObra(estado.obraAberta.obra.ID_Obra);
    } catch (erro) {
      mostrarErro(erro);
      botao.disabled = false; botao.textContent = 'Enviar para Contrato →';
    }
  }

  /* =========================================================
   * TELA 7 – Setor Contrato
   * Passos: Em elaboração → Aguardando assinatura → Assinado
   * ========================================================= */
  const PASSOS_CONTRATO = ['Em elaboração', 'Aguardando assinatura', 'Assinado'];

  // Lê um arquivo escolhido no computador/celular e prepara para enviar
  function lerArquivo(arquivo) {
    return new Promise((resolve, reject) => {
      if (arquivo.size > TAMANHO_MAXIMO_MB * 1024 * 1024) {
        return reject(new Error(`O arquivo passa de ${TAMANHO_MAXIMO_MB} MB. Envie um arquivo menor.`));
      }
      const leitor = new FileReader();
      leitor.onload = () => resolve({
        nome: arquivo.name, tipo: arquivo.type || 'application/octet-stream', base64: leitor.result.split(',')[1]
      });
      leitor.onerror = () => reject(new Error('Não foi possível ler o arquivo.'));
      leitor.readAsDataURL(arquivo);
    });
  }

  async function telaContrato(idObra) {
    carregando('Abrindo Contrato…');
    try {
      estado.contrato = await chamar('abrirContrato', idObra, auth());
      desenharContrato();
    } catch (erro) { mostrarErro(erro); irPara('#/obra/' + idObra); }
  }

  function linkArquivo(url, texto) {
    return url ? `<a class="ver-arquivo" href="${esc(url)}" target="_blank" rel="noopener">${ICONE_CLIPE} ${texto}</a>` : '';
  }

  function desenharContrato() {
    const { obra, contrato: c, aditivos, venda, podeEditar, podeAprovarAditivo, comercialEnviado } = estado.contrato;
    const passo = Math.max(0, PASSOS_CONTRATO.indexOf(c.Passo));
    const assinado = c.Passo === 'Assinado';
    const admin = estado.usuario.Nivel === 'Administrador';
    const editavelDados = podeEditar && (!assinado || admin);

    const passos = PASSOS_CONTRATO.map((nome, i) => {
      const feito = i < passo || assinado;
      const cls = feito ? 'feito' : i === passo ? 'atual' : '';
      const linha = i < PASSOS_CONTRATO.length - 1 ? `<div class="linha-passo ${i < passo ? 'feito' : ''}"></div>` : '';
      return `<div class="passo ${cls}"><span class="bola">${feito ? '✓' : i + 1}</span>${nome}</div>${linha}`;
    }).join('');

    // O que falta para avançar
    let aviso;
    if (assinado) {
      aviso = `<div class="aviso ok">Contrato assinado em ${dataBR(c.DataAssinatura)}. A Engenharia foi liberada. Mudanças agora são feitas por aditivo.</div>`;
    } else if (!podeEditar) {
      aviso = `<div class="aviso info">Você está vendo o contrato apenas para consulta.</div>`;
    } else if (passo === 0) {
      const falta = [];
      if (!c.Numero) falta.push('o número');
      if (!c.InicioOficial || !c.EntregaOficial) falta.push('as datas oficiais');
      if (!c.ArquivoMinuta) falta.push('a minuta em PDF');
      aviso = falta.length
        ? `<div class="aviso">Falta preencher ${falta.join(', ')} para enviar ao cliente assinar.</div>`
        : `<div class="aviso info">Tudo pronto. Quando enviar a minuta ao cliente, clique em "Enviar para assinatura".</div>`;
    } else {
      aviso = `<div class="aviso">Aguardando o cliente assinar. Quando receber, anexe o contrato assinado.</div>`;
    }
    const avisoComercial = !comercialEnviado && !assinado
      ? `<div class="aviso info">O Comercial ainda não concluiu a ficha desta obra. Você pode adiantar o contrato mesmo assim.</div>` : '';

    const campo = (nome, rotulo, tipo, valor) => editavelDados
      ? `<div class="campo"><label for="ct-${nome}">${rotulo}</label>
           <input id="ct-${nome}" name="${nome}" type="${tipo}" value="${esc(valor)}"></div>`
      : `<div class="campo"><label>${rotulo}</label><div class="valor">${tipo === 'date' ? dataBR(valor) : esc(valor) || '—'}</div></div>`;
    const prazo = c.InicioOficial && c.EntregaOficial
      ? Math.round((Date.parse(c.EntregaOficial) - Date.parse(c.InicioOficial)) / 864e5) + ' dias corridos' : '—';

    // Arquivos: minuta e assinado
    let arquivos = `<div class="arquivo-linha">
        <div><strong>Minuta</strong><div class="suave pequeno">Versão enviada ao cliente</div></div>
        <div class="anexo">${linkArquivo(c.ArquivoMinuta, 'Ver minuta')}
